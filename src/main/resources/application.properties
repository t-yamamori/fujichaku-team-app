# PostgreSQLを使うときのドライバーの定義
spring.datasource.driver-class-name=org.postgresql.Driver

# データベースへの接続URLを設定
spring.datasource.url=jdbc:postgresql://localhost:5432/Fujichaku

# データベース接続のためのユーザー名を設定
spring.datasource.username=postgres

# データベース接続のためのパスワードを設定
spring.datasource.password=postgrestest

# SQLのカラム名がスネークケース、Javaがキャメルケースのときの自動変換
mybatis.configuration.map-underscore-to-camel-case=false

# MyBatisのMapper XMLを読み込む
mybatis.mapper-locations=classpath:/mapper/*.xml

# HTTPリクエストのサイズ上限（413エラー対策）
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# マルチパートリクエストのサイズ上限
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
