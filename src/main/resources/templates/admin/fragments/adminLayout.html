<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

    <aside class="admin-sidebar" th:fragment="sidebar">

        <!-- ロゴ・システム情報 -->
        <div class="admin-sidebar-brand">
            <div class="admin-sidebar-logo">FUJICHAKU</div>
            <div class="admin-sidebar-subtitle">
                MATRIX ADMIN TERMINAL
            </div>

            <div class="admin-sidebar-status">
                <span class="admin-status-dot"></span>
                SYSTEM ONLINE
            </div>
        </div>

        <!-- 共通メニュー -->
        <nav class="admin-sidebar-nav">
            <div class="admin-menu-label">ADMIN MENU</div>

            <a class="admin-menu-link" th:href="@{/admin/index}">
                <span class="admin-menu-icon">01</span>
                <span>管理者TOP</span>
            </a>

           <a class="admin-menu-link" th:href="@{/admin/tenants}">
                <span class="admin-menu-icon">02</span>
                <span>テナント管理</span>
            </a>

            <a class="admin-menu-link" th:href="@{/admin/shop-admins}">

            <a class="admin-menu-link" th:href="@{/admin/members}">

                <span>会員管理</span>
            </a>

            <a class="admin-menu-link" th:href="@{/admin/reviews}">
                <span class="admin-menu-icon">05</span>
                <span>口コミ管理</span>
            </a>

            <a class="admin-menu-link" th:href="@{/admin/reservations}">
                <span class="admin-menu-icon">06</span>
                <span>予約管理</span>
            </a>

            <div class="admin-sidebar-divider"></div>

            <!-- ログアウト -->
            <form class="admin-logout-form"
                  th:action="@{/adminLogout}"
                  method="post">

                <button type="submit" class="admin-logout-button">
                    <span class="admin-menu-icon">OUT</span>
                    <span>ログアウト</span>
                </button>
            </form>
        </nav>

        <!-- サイドバー下部 -->
        <div class="admin-sidebar-footer">
            <div class="admin-footer-line"></div>
            <span>FUJICHAKU SYSTEM</span>
            <span class="admin-footer-version">
                ADMIN TERMINAL v1.0
            </span>
        </div>

    </aside>

</html>
