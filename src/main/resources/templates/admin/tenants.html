<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>テナント管理</title>
	<link rel="stylesheet" th:href="@{/css/adminLayoutTop.css}">
    <link rel="stylesheet" th:href="@{/css/adminLayout.css}">
    <link rel="stylesheet" th:href="@{/css/tenants.css}">
	
</head>

<body>
    <canvas id="matrixRain" aria-hidden="true"></canvas>
    <div class="screen-overlay" aria-hidden="true"></div>
    <!-- 共通サイドメニュー -->
    <header th:replace="~{admin/fragments/adminLayout :: sidebar}"></header>

    <main>
        <h1>テナント管理</h1>

        <!-- 検索フォーム -->
        <form id="searchForm"
              th:action="@{/admin/tenants}"
              th:object="${filters}"
              method="get"
              class="tenant-search">

            <div class="search-field search-field-id">
                <label for="filterId">ID</label>
                <input type="text" id="filterId" th:field="*{id}">
            </div>

            <div class="search-field">
                <label for="filterName">名前</label>
                <input type="text" id="filterName" th:field="*{name}">
            </div>

            <div class="search-field">
                <label for="filterNameKana">ふりがな</label>
                <input type="text" id="filterNameKana" th:field="*{nameKana}">
            </div>

            <div class="search-field">
                <label for="filterMail">メール</label>
                <input type="text" id="filterMail" th:field="*{mail}">
            </div>

            <div class="search-field">
                <label for="filterPhone">電話番号</label>
                <input type="text" id="filterPhone" th:field="*{phone}">
            </div>

            <div class="search-field">
                <label for="filterRepresentative">代表者</label>
                <input type="text" id="filterRepresentative" th:field="*{representative}">
            </div>

            <div class="search-field">
                <label for="filterAddress">住所</label>
                <input type="text" id="filterAddress" th:field="*{address}">
            </div>

            <div class="search-field">
                <label for="filterDescription">説明</label>
                <input type="text" id="filterDescription" th:field="*{description}">
            </div>

            <div class="search-field">
                <label for="filterPictureUrl">画像URL</label>
                <input type="text" id="filterPictureUrl" th:field="*{pictureUrl}">
            </div>

            <div class="search-buttons">
                <button type="submit">検索</button>
                <a th:href="@{/admin/tenants}">条件クリア</a>
            </div>
        </form>

        <!-- 更新完了メッセージ -->
        <div th:if="${successMessage != null}"
             class="success-message"
             style="white-space: pre-line;"
             th:text="${successMessage}">
        </div>

        <!-- 一括更新フォーム -->
        <form id="bulkUpdateForm"
              th:action="@{/admin/tenants/update}"
              th:object="${updateForm}"
              method="post">
            <input type="hidden" name="id" th:value="${filters.id}">
            <input type="hidden" name="name" th:value="${filters.name}">
            <input type="hidden" name="nameKana" th:value="${filters.nameKana}">
            <input type="hidden" name="mail" th:value="${filters.mail}">
            <input type="hidden" name="phone" th:value="${filters.phone}">
            <input type="hidden" name="representative" th:value="${filters.representative}">
            <input type="hidden" name="address" th:value="${filters.address}">
            <input type="hidden" name="description" th:value="${filters.description}">
            <input type="hidden" name="pictureUrl" th:value="${filters.pictureUrl}">
        </form>

        <!-- 新規登録フォーム -->
        <form id="createForm"
              th:action="@{/admin/tenants/create}"
              th:object="${newStore}"
              method="post">
            <input type="hidden" name="id" th:value="${filters.id}">
            <input type="hidden" name="name" th:value="${filters.name}">
            <input type="hidden" name="nameKana" th:value="${filters.nameKana}">
            <input type="hidden" name="mail" th:value="${filters.mail}">
            <input type="hidden" name="phone" th:value="${filters.phone}">
            <input type="hidden" name="representative" th:value="${filters.representative}">
            <input type="hidden" name="address" th:value="${filters.address}">
            <input type="hidden" name="description" th:value="${filters.description}">
            <input type="hidden" name="pictureUrl" th:value="${filters.pictureUrl}">
        </form>

        <!-- 削除フォーム -->
        <form id="deleteForm"
              th:action="@{/admin/tenants/delete}"
              method="post">
            <input type="hidden" name="id" th:value="${filters.id}">
            <input type="hidden" name="name" th:value="${filters.name}">
            <input type="hidden" name="nameKana" th:value="${filters.nameKana}">
            <input type="hidden" name="mail" th:value="${filters.mail}">
            <input type="hidden" name="phone" th:value="${filters.phone}">
            <input type="hidden" name="representative" th:value="${filters.representative}">
            <input type="hidden" name="address" th:value="${filters.address}">
            <input type="hidden" name="description" th:value="${filters.description}">
            <input type="hidden" name="pictureUrl" th:value="${filters.pictureUrl}">
        </form>

        <!-- 一括削除・一括更新ボタン：同じ行に配置 -->
        <div class="table-actions">
            <button type="submit" form="deleteForm">
                チェックした店舗を削除
            </button>

            <button type="submit" form="bulkUpdateForm">
                一括更新
            </button>
        </div>

        <!-- テナント一覧全体の横スクロール領域 -->
        <div class="tenant-table-frame">

            <!-- 固定ヘッダー -->
            <table class="tenant-table tenant-header-table">
                <colgroup>
                    <col class="col-delete">
                    <col class="col-id">
                    <col class="col-name">
                    <col class="col-name-kana">
                    <col class="col-mail">
                    <col class="col-phone">
                    <col class="col-representative">
                    <col class="col-address">
                    <col class="col-description">
                    <col class="col-picture">
                    <col class="col-operation">
                </colgroup>
                <thead>
                    <tr>
                        <th>削除</th>
                        <th>ID</th>
                        <th>名前</th>
                        <th>ふりがな</th>
                        <th>メール</th>
                        <th>電話番号</th>
                        <th>代表者</th>
                        <th>住所</th>
                        <th>説明</th>
                        <th>画像URL</th>
                        <th>操作</th>
                    </tr>
                </thead>
            </table>

            <!-- 既存テナントの縦スクロール領域 -->
            <div class="tenant-table-data-wrapper">
                <table class="tenant-table tenant-data-table">
                    <colgroup>
                        <col class="col-delete">
                        <col class="col-id">
                        <col class="col-name">
                        <col class="col-name-kana">
                        <col class="col-mail">
                        <col class="col-phone">
                        <col class="col-representative">
                        <col class="col-address">
                        <col class="col-description">
                        <col class="col-picture">
                        <col class="col-operation">
                    </colgroup>
                    <tbody>
                        <!-- 既存テナント -->
                        <tr th:each="store, stat : ${stores}">
                            <td>
                                <input type="checkbox"
                                       name="deleteIds"
                                       th:value="${store.id}"
                                       form="deleteForm">
                            </td>

                            <td>
                                <span th:text="${store.id}">1</span>
                                <input type="hidden"
                                       th:name="|stores[${stat.index}].id|"
                                       th:value="${store.id}"
                                       form="bulkUpdateForm">
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].name|"
                                       th:value="${store.name}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('name')}"
                                     th:text="${updateErrors[stat.index]['name']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].nameKana|"
                                       th:value="${store.nameKana}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('nameKana')}"
                                     th:text="${updateErrors[stat.index]['nameKana']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].mail|"
                                       th:value="${store.mail}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('mail')}"
                                     th:text="${updateErrors[stat.index]['mail']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].phone|"
                                       th:value="${store.phone}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('phone')}"
                                     th:text="${updateErrors[stat.index]['phone']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].representative|"
                                       th:value="${store.representative}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('representative')}"
                                     th:text="${updateErrors[stat.index]['representative']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].address|"
                                       th:value="${store.address}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('address')}"
                                     th:text="${updateErrors[stat.index]['address']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].description|"
                                       th:value="${store.description}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('description')}"
                                     th:text="${updateErrors[stat.index]['description']}">
                                </div>
                            </td>

                            <td>
                                <input type="text"
                                       th:name="|stores[${stat.index}].pictureUrl|"
                                       th:value="${store.pictureUrl}"
                                       form="bulkUpdateForm">
                                <div class="error-message"
                                     th:if="${updateErrors[stat.index] != null and updateErrors[stat.index].containsKey('pictureUrl')}"
                                     th:text="${updateErrors[stat.index]['pictureUrl']}">
                                </div>
                            </td>

                            <td>
                                <span>-</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 新規登録行：縦スクロールの外側、横スクロールの内側 -->
            <table class="tenant-table tenant-new-table">
                <colgroup>
                    <col class="col-delete">
                    <col class="col-id">
                    <col class="col-name">
                    <col class="col-name-kana">
                    <col class="col-mail">
                    <col class="col-phone">
                    <col class="col-representative">
                    <col class="col-address">
                    <col class="col-description">
                    <col class="col-picture">
                    <col class="col-operation">
                </colgroup>
                <tbody>
                    <tr th:object="${newStore}">
                        <td></td>
                        <td>新規</td>

                        <td>
                            <input type="text" th:field="*{name}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{nameKana}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('nameKana')}"
                                 th:errors="*{nameKana}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{mail}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('mail')}"
                                 th:errors="*{mail}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{phone}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{representative}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('representative')}"
                                 th:errors="*{representative}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{address}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{description}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">
                            </div>
                        </td>

                        <td>
                            <input type="text" th:field="*{pictureUrl}" form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('pictureUrl')}"
                                 th:errors="*{pictureUrl}">
                            </div>
                        </td>

                        <td>
                            <input type="password"
                                   class="new-password-input"
                                   th:field="*{password}"
                                   placeholder="パスワード"
                                   form="createForm">
                            <div class="error-message"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>
                            <button type="submit" form="createForm">作成</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
	<script th:src="@{/js/matrixRain.js}"></script>
</body>
</html>
