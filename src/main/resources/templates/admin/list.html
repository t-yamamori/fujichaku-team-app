<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUJICHAKU - 会員管理</title>

   
	<link rel="stylesheet" th:href="@{/css/adminLayout.css}">
	<link rel="stylesheet" th:href="@{/css/list.css}">
	
	
</head>

<body>

    <!-- 共通サイドバー -->
    <header th:replace="~{admin/fragments/adminLayout :: sidebar}"></header>

    <!-- 会員管理画面 -->
    <div class="member-management-layout">

        <main class="member-management-main">

            <h1 class="page-title">会員管理</h1>

            <div class="page-subtitle">
                MEMBER MANAGEMENT
            </div>

            <!-- 会員一覧カード -->
            <div class="member-card">

                <h2 class="card-title">
                    会員一覧
                    <span>MEMBER LIST</span>
                </h2>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>選択</th>
                                <th>会員ID</th>
                                <th>氏名</th>
                                <th>生年月日</th>
                                <th>メールアドレス</th>
                                <th>ポイント</th>
                                <th>予約履歴</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="member : ${members}"
                                th:attr="data-id=${member.id},
                                         data-name=${member.name},
                                         data-birth-date=${member.birthDate},
                                         data-mail=${member.mail}">

                                <td>
                                    <input type="checkbox"
                                           name="selectedId"
                                           th:value="${member.id}">
                                </td>

                                <td th:text="${member.id}"></td>
                                <td th:text="${member.name}"></td>
                                <td th:text="${member.birthDate}"></td>
                                <td th:text="${member.mail}"></td>
                                <td th:text="${member.point}"></td>

                                <td>
                                    <button type="button">確認</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 下部ボタン -->
                <div class="button-area">
                    <button type="button"
                            class="update-button"
                            onclick="openEditModal()">
                        更新
                    </button>

                    <button type="button"
                            class="delete-button"
                            onclick="openDeleteModal()">
                        削除
                    </button>

                    <button type="button"
                            class="create-button"
                            onclick="openCreateModal()">
                        ＋ 新規登録
                    </button>
                </div>

            </div>

            <!-- 編集モーダル -->
            <div id="editModal" class="modal">
                <div class="modal-content">
                    <h2>会員情報の更新</h2>

                    <form action="/admin/members/update" method="post">
                        <input type="hidden" id="editId" name="id">

                        <p>氏名</p>
                        <input type="text"
                               id="editName"
                               name="name"
                               required>

                        <p>生年月日</p>
                        <input type="date"
                               id="editBirthDate"
                               name="birthDate"
                               required>

                        <p>メールアドレス</p>
                        <input type="email"
                               id="editMail"
                               name="mail"
                               required>

                        <div class="modal-button-area">
                            <button type="submit" class="save-button">
                                保存
                            </button>

                            <button type="button"
                                    class="close-button"
                                    onclick="closeModal('editModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 削除確認モーダル -->
            <div id="deleteModal" class="modal">
                <div class="delete-modal-content">
                    <h2>会員の削除</h2>
                    <p>この会員を削除してもよろしいですか？</p>
                    <p id="deleteMemberName"></p>

                    <form action="/admin/members/delete" method="post">
                        <input type="hidden" id="deleteId" name="id">

                        <div class="delete-modal-buttons">
                            <button type="submit"
                                    class="delete-confirm-button">
                                削除する
                            </button>

                            <button type="button"
                                    class="delete-cancel-button"
                                    onclick="closeModal('deleteModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

								<td>
								    <form th:action="@{/admin/members/{id}/reservations(id=${member.id})}" method="get">
								        <button type="submit">確認</button>
								    </form>
								</td>

                    <form action="/admin/members/create" method="post">
                        <p>氏名</p>
                        <input type="text" name="name" required>

                        <p>生年月日</p>
                        <input type="date" name="birthDate" required>

                        <p>メールアドレス</p>
                        <input type="email" name="mail" required>

                        <p>パスワード</p>
                        <input type="password" name="password" required>

                        <div class="modal-button-area">
                            <button type="submit" class="save-button">
                                登録
                            </button>

                            <button type="button"
                                    class="close-button"
                                    onclick="closeModal('createModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 選択されている会員を取得する
        function getSelectedMember() {
            const checked = document.querySelectorAll(
                'input[name="selectedId"]:checked'
            );

            if (checked.length !== 1) {
                alert("会員を1人だけ選択してください。");
                return null;
            }

            return checked[0].closest("tr");
        }

        // 更新モーダルを開く
        function openEditModal() {
            const row = getSelectedMember();

            if (!row) {
                return;
            }

            document.getElementById("editId").value =
                row.dataset.id;

            document.getElementById("editName").value =
                row.dataset.name;

            document.getElementById("editBirthDate").value =
                row.dataset.birthDate;

            document.getElementById("editMail").value =
                row.dataset.mail;

            document.getElementById("editModal").style.display =
                "block";
        }

        // 削除確認モーダルを開く
        function openDeleteModal() {
            const row = getSelectedMember();

            if (!row) {
                return;
            }

            document.getElementById("deleteId").value =
                row.dataset.id;

            document.getElementById("deleteMemberName").textContent =
                row.dataset.name + " さん";

            document.getElementById("deleteModal").style.display =
                "block";
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            document.getElementById("createModal").style.display =
                "block";
        }

        // モーダルを閉じる
        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        // モーダルの背景部分をクリックした場合も閉じる
        document.querySelectorAll(".modal").forEach(function (modal) {
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        });

        // Escapeキーでモーダルを閉じる
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                document.querySelectorAll(".modal").forEach(function (modal) {
                    modal.style.display = "none";
                });
            }
        });
    </script>

</body>
</html>
