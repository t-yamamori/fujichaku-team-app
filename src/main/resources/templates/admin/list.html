<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUJICHAKU - 会員管理</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(230, 180, 200, 0.4) 0%, transparent 40%),
                radial-gradient(circle at bottom left, rgba(160, 150, 210, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #2b233d 0%, #1e182d 50%, #13101e 100%);
            color: #f8f6fb;
        }

        /* =========================
           ヘッダー
        ========================= */

        .header {
            height: 76px;
            padding: 0 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 24, 45, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(220, 180, 200, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            color: #f7d5a5;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(247, 213, 165, 0.3);
        }

        .admin-label {
            color: #e2b0c4;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* =========================
           全体レイアウト
        ========================= */

        .layout {
            display: flex;
            min-height: calc(100vh - 76px);
        }

        /* =========================
           サイドバー
        ========================= */

        .sidebar {
            width: 220px;
            padding: 35px 20px;
            background: rgba(22, 17, 33, 0.85);
            border-right: 1px solid rgba(220, 180, 200, 0.15);
        }

        .sidebar-title {
            color: #cbb4d9;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            padding-left: 10px;
        }

        .menu-item {
            display: block;
            padding: 15px 15px;
            margin-bottom: 8px;
            color: #d1c8db;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 14px;
        }

        .menu-item:hover {
            background-color: rgba(218, 140, 160, 0.15);
            color: #ffffff;
        }

        .menu-item.active {
            background: linear-gradient(90deg, #b8627d, #814f82);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(184, 98, 125, 0.35);
        }

        .menu-icon {
            margin-right: 8px;
            color: #e2b0c4;
        }

        .menu-item.active .menu-icon {
            color: #f7d5a5;
        }

        /* =========================
           メインコンテンツ
        ========================= */

        .main {
            flex: 1;
            padding: 40px 45px 60px;
            overflow-x: auto;
        }

        .page-title {
            margin: 0;
            color: #f7d5a5;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .page-subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #d8b0c5;
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* =========================
           会員一覧カード
        ========================= */

        .member-card {
            background: linear-gradient(145deg, rgba(42, 34, 58, 0.75), rgba(25, 20, 36, 0.85));
            border: 1px solid rgba(230, 180, 200, 0.2);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
			
			display: flex;
			    flex-direction: column;
			    height: calc(100vh - 230px);
			    min-height: 300px;
        }

        .card-title {
            margin: 0 0 22px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }

        .card-title span {
            color: #e2b0c4;
            font-size: 12px;
            margin-left: 10px;
            letter-spacing: 1px;
        }

        /* =========================
           エラーメッセージ
        ========================= */

        .error-message {
            color: #ffb3b3;
            background-color: rgba(180, 60, 80, 0.25);
            border: 1px solid rgba(255, 120, 140, 0.4);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* =========================
           テーブル
        ========================= */


		.table-wrapper {
		    flex: 1;
		    min-height: 0;
		    overflow-y: auto;
		    overflow-x: auto;
		}


        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        thead {
            background-color: rgba(45, 34, 60, 0.8);
        }

        th {
            padding: 15px 12px;
            color: #f7d5a5;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid rgba(210, 160, 190, 0.3);
            white-space: nowrap;
        }

        td {
            padding: 14px 12px;
            color: #ece4f2;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            text-align: center;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(200, 130, 160, 0.12);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #b8627d;
            cursor: pointer;
        }

        /* =========================
           ボタン
        ========================= */

        .button-area {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
			flex-shrink: 0;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 25px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 確認ボタン */
        td button {
            padding: 6px 14px;
            background: linear-gradient(135deg, #a2618c, #704775);
            color: #ffffff;
            border-radius: 4px;
        }

        td button:hover {
            background: linear-gradient(135deg, #b870a0, #83548a);
        }

        .update-button {
            background: linear-gradient(135deg, #945889, #5d3d66);
            color: #ffffff;
        }

        .update-button:hover {
            background: linear-gradient(135deg, #aa679d, #6e4879);
            transform: translateY(-1px);
        }

        .delete-button {
            background: rgba(90, 35, 50, 0.6);
            color: #ffb8c6;
            border: 1px solid rgba(180, 80, 100, 0.4);
        }

        .delete-button:hover {
            background: rgba(120, 45, 65, 0.8);
        }

        .create-button {
            background: linear-gradient(135deg, #e0a36e, #b37343);
            color: #ffffff;
        }

        .create-button:hover {
            background: linear-gradient(135deg, #f0b480, #c48250);
            transform: translateY(-1px);
        }

        /* =========================
           モーダル
        ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 8, 15, 0.75);
            backdrop-filter: blur(6px);
        }

        .modal-content {
            width: 430px;
            max-width: 90%;
            margin: 90px auto;
            padding: 30px;
            background: linear-gradient(145deg, #2f253e, #1a1425);
            border: 1px solid rgba(220, 160, 190, 0.3);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #f7d5a5;
            font-size: 21px;
        }

        .modal-content p {
            margin: 17px 0;
            color: #e0d8e8;
            font-size: 13px;
        }

        .modal-content p span {
            color: #f7d5a5;
            font-weight: bold;
        }

        .modal-content input {
            width: 100%;
            margin-top: 7px;
            padding: 11px 12px;
            background-color: rgba(15, 12, 22, 0.8);
            color: #f5f5f5;
            border: 1px solid rgba(180, 140, 170, 0.3);
            border-radius: 6px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: #e2b0c4;
            box-shadow: 0 0 0 2px rgba(226, 176, 196, 0.2);
        }

        .modal-content input[readonly] {
            color: #d8b0c5;
            background-color: rgba(30, 24, 42, 0.8);
        }

        .modal-button-area {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            background: linear-gradient(135deg, #e0a36e, #b37343);
            color: #ffffff;
        }

        .close-button {
            background-color: rgba(60, 50, 75, 0.8);
            color: #e0d8e8;
            border: 1px solid rgba(120, 100, 140, 0.4);
        }

        .close-button:hover {
            background-color: rgba(80, 68, 98, 0.9);
        }

        /* =========================
           削除確認モーダル
        ========================= */

        .delete-modal-content {
            width: 430px;
            max-width: 90%;
            margin: 150px auto;
            padding: 32px;
            background: linear-gradient(145deg, #35212e, #1a1017);
            border: 1px solid rgba(220, 100, 120, 0.4);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .delete-modal-content h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #f7d5a5;
            font-size: 21px;
        }

        .delete-modal-subtitle {
            margin-bottom: 28px;
            color: #e2b0c4;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .delete-member-info {
            padding: 18px;
            margin-bottom: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(180, 120, 150, 0.2);
            border-radius: 6px;
        }

        .delete-member-info p {
            margin: 8px 0;
            color: #ded6e6;
            font-size: 13px;
        }

        .delete-member-info span {
            color: #ffffff;
            font-weight: bold;
        }

        .delete-warning {
            margin-bottom: 25px;
            color: #ffb8c6;
            font-size: 12px;
        }

        .delete-modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .delete-cancel-button {
            background-color: rgba(60, 50, 75, 0.8);
            color: #ddd;
            border: 1px solid rgba(120, 100, 140, 0.4);
        }

        .delete-cancel-button:hover {
            background-color: rgba(80, 68, 98, 0.9);
        }

        .delete-confirm-button {
            background: linear-gradient(135deg, #8b3c4f, #5a2230);
            color: #ffffff;
            border: 1px solid rgba(200, 80, 100, 0.5);
        }

        .delete-confirm-button:hover {
            background: linear-gradient(135deg, #a3475d, #6e2a3b);
        }

        /* =========================
           スマホ対応
        ========================= */

        @media (max-width: 800px) {

            .header {
                padding: 0 20px;
            }

            .sidebar {
                width: 170px;
                padding: 25px 12px;
            }

            .main {
                padding: 30px 20px;
            }

            .button-area {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }
		
		

		

		
    </style>

	<link rel="stylesheet" th:href="@{/css/adminLayout.css}">
	
	
	
</head>

<body>
	
	<!-- 共通サイドメニューを読み込む -->
	   <header th:replace="~{admin/fragments/adminLayout :: sidebar}"></header>

    <!-- =========================
         ヘッダー
    ========================== -->

   <!-- <header class="header">

        <div class="logo">
            FUJICHAKU
        </div>

        <div class="admin-label">
            ADMIN SYSTEM
        </div>

    </header>-->


    <!-- =========================
         全体レイアウト
    ========================== -->

    <div class="layout">




        <!-- =========================
             メイン
        ========================== -->

        <main class="main">

            <h1 class="page-title">
                会員管理
            </h1>

            <div class="page-subtitle">
                MEMBER MANAGEMENT
            </div>


            <!-- =========================
                 会員一覧カード
            ========================== -->

            <div class="member-card">

                <h2 class="card-title">
                    会員一覧
                    <span>MEMBER LIST</span>
                </h2>


                <!-- テーブル -->

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>選択</th>
                                <th>会員ID</th>
                                <th>氏名</th>
                                <th>生年月日</th>
                                <th>メールアドレス</th>
                                <th>ポイント</th>
                                <th>予約履歴</th>
                            </tr>

                        </thead>


                  

						<tbody>
						    <tr th:each="member : ${members}"
						        th:attr="data-id=${member.id},
						                 data-name=${member.name},
						                 data-birth-date=${member.birthDate},
						                 data-mail=${member.mail}">

						        <td>
						            <input type="checkbox"
						                   name="selectedId"
						                   th:value="${member.id}">
						        </td>

						        <td th:text="${member.id}"></td>
						        <td th:text="${member.name}"></td>
						        <td th:text="${member.birthDate}"></td>
						        <td th:text="${member.mail}"></td>
						        <td th:text="${member.point}"></td>

						        <td>
						            <button type="button">確認</button>
						        </td>

						    </tr>
						</tbody>
					
                        

                    </table>

                </div>


                <!-- =========================
                     下部ボタン
                ========================== -->

				<div class="button-area">
				    <button type="button"
				            class="update-button"
				            onclick="openEditModal()">
				        更新
				    </button>

				    <button type="button"
				            class="delete-button"
				            onclick="openDeleteModal()">
				        削除
				    </button>

				    <button type="button"
				            class="create-button"
				            onclick="openCreateModal()">
				        ＋ 新規登録
				    </button>
				</div>

            </div>
			
			<!-- 編集モーダル -->
			<div id="editModal" class="modal">
			    <div class="modal-content">
			        <h2>会員情報の更新</h2>

			        <form action="/admin/members/update" method="post">
			            <input type="hidden" id="editId" name="id">

			            <p>氏名</p>
			            <input type="text" id="editName" name="name"
			                   required>

			            <p>生年月日</p>
			            <input type="date" id="editBirthDate" name="birthDate"
			                   required>

			            <p>メールアドレス</p>
			            <input type="email" id="editMail" name="mail"
			                   required>

			            <div class="modal-button-area">
			                <button type="submit" class="save-button">
			                    保存
			                </button>
			                <button type="button" class="close-button"
			                        onclick="closeModal('editModal')">
			                    キャンセル
			                </button>
			            </div>
			        </form>
			    </div>
			</div>

			<!-- 削除確認モーダル -->
			<div id="deleteModal" class="modal">
			    <div class="delete-modal-content">
			        <h2>会員の削除</h2>
			        <p>この会員を削除してもよろしいですか？</p>
			        <p id="deleteMemberName"></p>

			        <form action="/admin/members/delete" method="post">
			            <input type="hidden" id="deleteId" name="id">

			            <div class="delete-modal-buttons">
			                <button type="submit"
			                        class="delete-confirm-button">
			                    削除する
			                </button>
			                <button type="button"
			                        class="delete-cancel-button"
			                        onclick="closeModal('deleteModal')">
			                    キャンセル
			                </button>
			            </div>
			        </form>
			    </div>
			</div>

			<!-- 新規登録モーダル -->
			<div id="createModal" class="modal">
			    <div class="modal-content">
			        <h2>新規会員登録</h2>

			        <form action="/admin/members/create" method="post">
			            <p>氏名</p>
			            <input type="text" name="name" required>

			            <p>生年月日</p>
			            <input type="date" name="birthDate" required>

			            <p>メールアドレス</p>
			            <input type="email" name="mail" required>

			            <p>パスワード</p>
			            <input type="password" name="password" required>

			            <div class="modal-button-area">
			                <button type="submit" class="save-button">
			                    登録
			                </button>
			                <button type="button" class="close-button"
			                        onclick="closeModal('createModal')">
			                    キャンセル
			                </button>
			            </div>
			        </form>
			    </div>
			</div>

        </main>

    </div>
	<script>
	    // 選択されている会員を取得する
	    function getSelectedMember() {
	        const checked = document.querySelectorAll(
	            'input[name="selectedId"]:checked'
	        );

	        if (checked.length !== 1) {
	            alert("会員を1人だけ選択してください。");
	            return null;
	        }

	        return checked[0].closest("tr");
	    }

	    // 更新モーダルを開く
	    function openEditModal() {
	        const row = getSelectedMember();
	        if (!row) return;

	        document.getElementById("editId").value =
	            row.dataset.id;
	        document.getElementById("editName").value =
	            row.dataset.name;
	        document.getElementById("editBirthDate").value =
	            row.dataset.birthDate;
	        document.getElementById("editMail").value =
	            row.dataset.mail;

	        document.getElementById("editModal").style.display =
	            "block";
	    }

	    // 削除確認モーダルを開く
	    function openDeleteModal() {
	        const row = getSelectedMember();
	        if (!row) return;

	        document.getElementById("deleteId").value =
	            row.dataset.id;
	        document.getElementById("deleteMemberName").textContent =
	            row.dataset.name + " さん";

	        document.getElementById("deleteModal").style.display =
	            "block";
	    }

	    // 新規登録モーダルを開く
	    function openCreateModal() {
	        document.getElementById("createModal").style.display =
	            "block";
	    }

	    // モーダルを閉じる
	    function closeModal(id) {
	        document.getElementById(id).style.display = "none";
	    }
	</script>

</body>

</html>
