<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FUJICHAKU - 会員管理</title>

    <!-- 共通サイドバーCSS -->
    <link rel="stylesheet" th:href="@{/css/adminLayout.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --member-sidebar-width: var(--admin-sidebar-width, 260px);
        }

        html {
            min-height: 100%;
            background: #13101e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(230, 180, 200, 0.4) 0%, transparent 40%),
                radial-gradient(circle at bottom left, rgba(160, 150, 210, 0.3) 0%, transparent 50%),
                linear-gradient(135deg, #2b233d 0%, #1e182d 50%, #13101e 100%);
            color: #f8f6fb;
        }

        /* =========================
           共通サイドバーとの位置調整
           ========================= */

        .member-management-layout {
            display: block;
            margin-left: var(--member-sidebar-width);
            min-height: 100vh;
            min-width: 0;
        }

        .member-management-main {
            min-width: 0;
            padding: 40px 45px 60px;
            overflow-x: auto;
        }

        /* =========================
           ページタイトル
           ========================= */

        .page-title {
            margin: 0;
            color: #f7d5a5;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .page-subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #d8b0c5;
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* =========================
           会員一覧カード
           ========================= */

        .member-card {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 230px);
            min-height: 300px;
            padding: 28px;

            background: linear-gradient(
                145deg,
                rgba(42, 34, 58, 0.75),
                rgba(25, 20, 36, 0.85)
            );

            border: 1px solid rgba(230, 180, 200, 0.2);
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .card-title {
            flex-shrink: 0;
            margin: 0 0 22px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }

        .card-title span {
            margin-left: 10px;
            color: #e2b0c4;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* =========================
           エラーメッセージ
           ========================= */

        .error-message {
            flex-shrink: 0;
            margin-bottom: 20px;
            padding: 12px 15px;
            color: #ffb3b3;
            background-color: rgba(180, 60, 80, 0.25);
            border: 1px solid rgba(255, 120, 140, 0.4);
            border-radius: 6px;
        }

        /* =========================
           会員テーブル
           ========================= */

        .table-wrapper {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        .table-wrapper table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        .table-wrapper thead {
            background-color: rgba(45, 34, 60, 0.8);
        }

        .table-wrapper th {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 15px 12px;
            color: #f7d5a5;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            background-color: #30243e;
            border-bottom: 1px solid rgba(210, 160, 190, 0.3);
        }

        .table-wrapper td {
            padding: 14px 12px;
            color: #ece4f2;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .table-wrapper tbody tr {
            transition: background-color 0.2s;
        }

        .table-wrapper tbody tr:hover {
            background-color: rgba(200, 130, 160, 0.12);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #b8627d;
            cursor: pointer;
        }

        /* =========================
           ボタン
           ========================= */

        .button-area {
            display: flex;
            flex-shrink: 0;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .member-management-main button {
            padding: 11px 25px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .member-management-main td button {
            padding: 6px 14px;
            color: #ffffff;
            background: linear-gradient(135deg, #a2618c, #704775);
            border-radius: 4px;
        }

        .member-management-main td button:hover {
            background: linear-gradient(135deg, #b870a0, #83548a);
        }

        .update-button {
            color: #ffffff;
            background: linear-gradient(135deg, #945889, #5d3d66);
        }

        .update-button:hover {
            background: linear-gradient(135deg, #aa679d, #6e4879);
            transform: translateY(-1px);
        }

        .delete-button {
            color: #ffb8c6;
            background: rgba(90, 35, 50, 0.6);
            border: 1px solid rgba(180, 80, 100, 0.4) !important;
        }

        .delete-button:hover {
            background: rgba(120, 45, 65, 0.8);
        }

        .create-button {
            color: #ffffff;
            background: linear-gradient(135deg, #e0a36e, #b37343);
        }

        .create-button:hover {
            background: linear-gradient(135deg, #f0b480, #c48250);
            transform: translateY(-1px);
        }

        /* =========================
           編集・新規登録モーダル
           ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: rgba(10, 8, 15, 0.75);
            backdrop-filter: blur(6px);
        }

        .modal-content {
            width: 430px;
            max-width: calc(100% - 30px);
            margin: 90px auto;
            padding: 30px;
            background: linear-gradient(145deg, #2f253e, #1a1425);
            border: 1px solid rgba(220, 160, 190, 0.3);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #f7d5a5;
            font-size: 21px;
        }

        .modal-content p {
            margin: 17px 0;
            color: #e0d8e8;
            font-size: 13px;
        }

        .modal-content p span {
            color: #f7d5a5;
            font-weight: bold;
        }

        .modal-content input {
            width: 100%;
            margin-top: 7px;
            padding: 11px 12px;
            color: #f5f5f5;
            background-color: rgba(15, 12, 22, 0.8);
            border: 1px solid rgba(180, 140, 170, 0.3);
            border-radius: 6px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: #e2b0c4;
            box-shadow: 0 0 0 2px rgba(226, 176, 196, 0.2);
        }

        .modal-content input[readonly] {
            color: #d8b0c5;
            background-color: rgba(30, 24, 42, 0.8);
        }

        .modal-button-area {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .save-button {
            color: #ffffff;
            background: linear-gradient(135deg, #e0a36e, #b37343);
        }

        .close-button {
            color: #e0d8e8;
            background-color: rgba(60, 50, 75, 0.8);
            border: 1px solid rgba(120, 100, 140, 0.4) !important;
        }

        .close-button:hover {
            background-color: rgba(80, 68, 98, 0.9);
        }

        /* =========================
           削除確認モーダル
           ========================= */

        .delete-modal-content {
            width: 430px;
            max-width: calc(100% - 30px);
            margin: 150px auto;
            padding: 32px;
            background: linear-gradient(145deg, #35212e, #1a1017);
            border: 1px solid rgba(220, 100, 120, 0.4);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .delete-modal-content h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #f7d5a5;
            font-size: 21px;
        }

        .delete-modal-content > p {
            color: #e0d8e8;
            font-size: 13px;
        }

        .delete-modal-subtitle {
            margin-bottom: 28px;
            color: #e2b0c4;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .delete-member-info {
            padding: 18px;
            margin-bottom: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(180, 120, 150, 0.2);
            border-radius: 6px;
        }

        .delete-member-info p {
            margin: 8px 0;
            color: #ded6e6;
            font-size: 13px;
        }

        .delete-member-info span {
            color: #ffffff;
            font-weight: bold;
        }

        .delete-warning {
            margin-bottom: 25px;
            color: #ffb8c6;
            font-size: 12px;
        }

        .delete-modal-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .delete-cancel-button {
            color: #dddddd;
            background-color: rgba(60, 50, 75, 0.8);
            border: 1px solid rgba(120, 100, 140, 0.4) !important;
        }

        .delete-cancel-button:hover {
            background-color: rgba(80, 68, 98, 0.9);
        }

        .delete-confirm-button {
            color: #ffffff;
            background: linear-gradient(135deg, #8b3c4f, #5a2230);
            border: 1px solid rgba(200, 80, 100, 0.5) !important;
        }

        .delete-confirm-button:hover {
            background: linear-gradient(135deg, #a3475d, #6e2a3b);
        }

        /* =========================
           タブレット・スマホ対応
           ========================= */

        @media (max-width: 900px) {
            .member-management-main {
                padding: 30px 24px;
            }

            .member-card {
                padding: 22px;
            }
        }

        @media (max-width: 600px) {
            .member-management-layout {
                margin-left: 74px;
            }

            .member-management-main {
                padding: 24px 15px;
            }

            .page-title {
                font-size: 23px;
            }

            .member-card {
                height: calc(100vh - 190px);
                min-height: 300px;
                padding: 18px;
            }

            .button-area {
                justify-content: flex-start;
            }

            .member-management-main button {
                padding: 10px 16px;
            }

            .modal-content {
                margin: 35px auto;
                padding: 22px;
            }

            .delete-modal-content {
                margin: 60px auto;
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- 共通サイドバー -->
    <header th:replace="~{admin/fragments/adminLayout :: sidebar}"></header>

    <!-- 会員管理画面 -->
    <div class="member-management-layout">

        <main class="member-management-main">

            <h1 class="page-title">会員管理</h1>

            <div class="page-subtitle">
                MEMBER MANAGEMENT
            </div>

            <!-- 会員一覧カード -->
            <div class="member-card">

                <h2 class="card-title">
                    会員一覧
                    <span>MEMBER LIST</span>
                </h2>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>選択</th>
                                <th>会員ID</th>
                                <th>氏名</th>
                                <th>生年月日</th>
                                <th>メールアドレス</th>
                                <th>ポイント</th>
                                <th>予約履歴</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="member : ${members}"
                                th:attr="data-id=${member.id},
                                         data-name=${member.name},
                                         data-birth-date=${member.birthDate},
                                         data-mail=${member.mail}">

                                <td>
                                    <input type="checkbox"
                                           name="selectedId"
                                           th:value="${member.id}">
                                </td>

                                <td th:text="${member.id}"></td>
                                <td th:text="${member.name}"></td>
                                <td th:text="${member.birthDate}"></td>
                                <td th:text="${member.mail}"></td>
                                <td th:text="${member.point}"></td>

                                <td>
                                    <button type="button">確認</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 下部ボタン -->
                <div class="button-area">
                    <button type="button"
                            class="update-button"
                            onclick="openEditModal()">
                        更新
                    </button>

                    <button type="button"
                            class="delete-button"
                            onclick="openDeleteModal()">
                        削除
                    </button>

                    <button type="button"
                            class="create-button"
                            onclick="openCreateModal()">
                        ＋ 新規登録
                    </button>
                </div>

            </div>

            <!-- 編集モーダル -->
            <div id="editModal" class="modal">
                <div class="modal-content">
                    <h2>会員情報の更新</h2>

                    <form action="/admin/members/update" method="post">
                        <input type="hidden" id="editId" name="id">

                        <p>氏名</p>
                        <input type="text"
                               id="editName"
                               name="name"
                               required>

                        <p>生年月日</p>
                        <input type="date"
                               id="editBirthDate"
                               name="birthDate"
                               required>

                        <p>メールアドレス</p>
                        <input type="email"
                               id="editMail"
                               name="mail"
                               required>

                        <div class="modal-button-area">
                            <button type="submit" class="save-button">
                                保存
                            </button>

                            <button type="button"
                                    class="close-button"
                                    onclick="closeModal('editModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 削除確認モーダル -->
            <div id="deleteModal" class="modal">
                <div class="delete-modal-content">
                    <h2>会員の削除</h2>
                    <p>この会員を削除してもよろしいですか？</p>
                    <p id="deleteMemberName"></p>

                    <form action="/admin/members/delete" method="post">
                        <input type="hidden" id="deleteId" name="id">

                        <div class="delete-modal-buttons">
                            <button type="submit"
                                    class="delete-confirm-button">
                                削除する
                            </button>

                            <button type="button"
                                    class="delete-cancel-button"
                                    onclick="closeModal('deleteModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 新規登録モーダル -->
            <div id="createModal" class="modal">
                <div class="modal-content">
                    <h2>新規会員登録</h2>

                    <form action="/admin/members/create" method="post">
                        <p>氏名</p>
                        <input type="text" name="name" required>

                        <p>生年月日</p>
                        <input type="date" name="birthDate" required>

                        <p>メールアドレス</p>
                        <input type="email" name="mail" required>

                        <p>パスワード</p>
                        <input type="password" name="password" required>

                        <div class="modal-button-area">
                            <button type="submit" class="save-button">
                                登録
                            </button>

                            <button type="button"
                                    class="close-button"
                                    onclick="closeModal('createModal')">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 選択されている会員を取得する
        function getSelectedMember() {
            const checked = document.querySelectorAll(
                'input[name="selectedId"]:checked'
            );

            if (checked.length !== 1) {
                alert("会員を1人だけ選択してください。");
                return null;
            }

            return checked[0].closest("tr");
        }

        // 更新モーダルを開く
        function openEditModal() {
            const row = getSelectedMember();

            if (!row) {
                return;
            }

            document.getElementById("editId").value =
                row.dataset.id;

            document.getElementById("editName").value =
                row.dataset.name;

            document.getElementById("editBirthDate").value =
                row.dataset.birthDate;

            document.getElementById("editMail").value =
                row.dataset.mail;

            document.getElementById("editModal").style.display =
                "block";
        }

        // 削除確認モーダルを開く
        function openDeleteModal() {
            const row = getSelectedMember();

            if (!row) {
                return;
            }

            document.getElementById("deleteId").value =
                row.dataset.id;

            document.getElementById("deleteMemberName").textContent =
                row.dataset.name + " さん";

            document.getElementById("deleteModal").style.display =
                "block";
        }

        // 新規登録モーダルを開く
        function openCreateModal() {
            document.getElementById("createModal").style.display =
                "block";
        }

        // モーダルを閉じる
        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        // モーダルの背景部分をクリックした場合も閉じる
        document.querySelectorAll(".modal").forEach(function (modal) {
            modal.addEventListener("click", function (event) {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        });

        // Escapeキーでモーダルを閉じる
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                document.querySelectorAll(".modal").forEach(function (modal) {
                    modal.style.display = "none";
                });
            }
        });
    </script>

</body>
</html>
