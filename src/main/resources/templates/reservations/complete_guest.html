<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約完了 | FUJICHAKU</title>

    <style>
        :root {
            --matrix-green: #00ff41;
            --matrix-dark-green: #008f11;
            --matrix-bg: #000;
            --matrix-panel: rgba(0, 12, 3, 0.94);
            --matrix-border: rgba(0, 255, 65, 0.55);
            --matrix-text: #d5ffdc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 16px;
            background: var(--matrix-bg);
            color: var(--matrix-text);
            font-family: "Consolas", "Courier New", monospace;
        }

        #matrix-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.32;
        }

        .page-content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .container {
            padding: 35px;
            background: var(--matrix-panel);
            border: 1px solid var(--matrix-border);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.12),
                        inset 0 0 20px rgba(0, 255, 65, 0.025);
        }

        .system-label {
            margin: 0 0 12px;
            color: var(--matrix-dark-green);
            font-size: 12px;
            letter-spacing: 3px;
            text-align: center;
        }

        .page-title {
            margin: 0 0 20px;
            color: var(--matrix-green);
            font-size: clamp(26px, 5vw, 36px);
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
            letter-spacing: 3px;
        }

        .success-message {
            margin: 0 0 30px;
            color: var(--matrix-green);
            font-size: 16px;
            line-height: 1.9;
            text-align: center;
        }

        .success-icon {
            display: block;
            margin: 0 auto 14px;
            width: 58px;
            height: 58px;
            line-height: 54px;
            border: 2px solid var(--matrix-green);
            border-radius: 50%;
            font-size: 32px;
            text-shadow: 0 0 12px var(--matrix-green);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.25);
        }

        .note {
            margin-bottom: 30px;
            padding: 18px;
            color: #d9ffd9;
            background: rgba(0, 40, 12, 0.65);
            border: 1px solid var(--matrix-dark-green);
            border-left: 4px solid var(--matrix-green);
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.9;
        }

        .note strong {
            display: block;
            margin-bottom: 7px;
            color: var(--matrix-green);
            font-size: 15px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin: 0 0 18px;
            padding: 0 0 12px;
            color: var(--matrix-green);
            font-size: 20px;
            border-bottom: 1px solid var(--matrix-border);
        }

        .section h2::before {
            content: "> ";
            color: var(--matrix-dark-green);
        }

        .reservation-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            overflow-wrap: anywhere;
        }

        .reservation-table th,
        .reservation-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            text-align: left;
            line-height: 1.7;
        }

        .reservation-table th {
            width: 32%;
            color: var(--matrix-green);
            background: rgba(0, 255, 65, 0.055);
            font-weight: normal;
        }

        .reservation-table td {
            color: #e1ffe5;
        }

        .reservation-number {
            color: var(--matrix-green);
            font-size: 23px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-dark-green);
            border-radius: 3px;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            min-width: 200px;
            padding: 14px 24px;
            border: 1px solid var(--matrix-green);
            border-radius: 4px;
            color: var(--matrix-green);
            background: rgba(0, 255, 65, 0.06);
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, box-shadow 0.2s, color 0.2s;
        }

        .btn:hover {
            color: #000;
            background: var(--matrix-green);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.45);
        }

        .footer-text {
            margin: 25px 0 0;
            color: #438d53;
            font-size: 11px;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .container {
                padding: 22px 15px;
            }

            .page-title {
                letter-spacing: 1px;
            }

            .note {
                padding: 14px;
            }

            .reservation-table th,
            .reservation-table td {
                padding: 12px 9px;
                font-size: 13px;
            }

            .reservation-table th {
                width: 34%;
            }

            .reservation-number {
                font-size: 20px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- マトリックス風デジタルレイン -->
    <canvas id="matrix-canvas"></canvas>

    <main class="page-content">
        <div class="container">

            <p class="system-label">FUJICHAKU // RESERVATION SYSTEM</p>

            <h1 class="page-title">予約完了</h1>

            <div class="success-message">
                <span class="success-icon">✓</span>
                予約が完了しました。<br>
                ご予約ありがとうございます。
            </div>

            <!-- 非会員向け注意 -->
            <div class="note">
                <strong>WARNING // 非会員のお客様へ</strong>
                非会員の方は予約履歴をご利用いただけません。<br>
                この画面を閉じる前に、予約内容をスクリーンショット等で保存してください。
            </div>

            <!-- 予約内容 -->
            <section class="section">
                <h2>予約内容</h2>

                <table class="reservation-table">
                    <tbody>
                        <tr>
                            <th>予約番号</th>
                            <td>
                                <strong class="reservation-number"
                                        th:text="${reservation.id}">100</strong>
                            </td>
                        </tr>

                        <tr>
                            <th>店舗</th>
                            <td th:text="${store.name}">店舗名</td>
                        </tr>

                        <tr>
                            <th>予約日時</th>
                            <td th:text="${#temporals.format(reservation.reservationDate, 'yyyy年MM月dd日 HH:mm')}">
                                2026年10月07日 18:00
                            </td>
                        </tr>

                        <tr>
                            <th>人数</th>
                            <td>
                                <span th:text="${reservation.number}">2</span> 名
                            </td>
                        </tr>

                        <tr>
                            <th>状況</th>
                            <td>
                                <span class="status"
                                      th:text="${reservation.status}">予約済み</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <div class="top-bar">
                <a class="btn" th:href="@{/shops}">▶ 店舗一覧へ戻る</a>
            </div>

            <p class="footer-text">
                SYSTEM STATUS: RESERVATION COMPLETED
            </p>

        </div>
    </main>

    <!-- Matrix rain animation -->
	<script>
	(() => {
	    const canvas = document.getElementById("matrix-canvas");
	    const ctx = canvas.getContext("2d");

	    const characters =
	        "アイウエオカキクケコサシスセソタチツテトナニヌネノ" +
	        "ハヒフヘホマミムメモヤユヨラリルレロワヲン" +
	        "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";

	    const fontSize = 16;
	    let columns = 0;
	    let drops = [];
	    let speeds = [];

	    function resizeCanvas() {
	        const dpr = Math.min(window.devicePixelRatio || 1, 2);

	        canvas.width = window.innerWidth * dpr;
	        canvas.height = window.innerHeight * dpr;
	        canvas.style.width = window.innerWidth + "px";
	        canvas.style.height = window.innerHeight + "px";

	        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

	        columns = Math.ceil(window.innerWidth / fontSize);

	        drops = Array.from(
	            { length: columns },
	            () => Math.random() * -(window.innerHeight / fontSize)
	        );

	        speeds = Array.from(
	            { length: columns },
	            () => 0.7 + Math.random() * 1.5
	        );
	    }

	    function drawMatrix() {
	        const width = window.innerWidth;
	        const height = window.innerHeight;

	        // 背景を薄く塗り、文字の軌跡を残す
	        ctx.fillStyle = "rgba(0, 0, 0, 0.045)";
	        ctx.fillRect(0, 0, width, height);

	        ctx.font = "bold " + fontSize + "px monospace";
	        ctx.textBaseline = "top";

	        for (let i = 0; i < drops.length; i++) {
	            const x = i * fontSize;
	            const y = drops[i] * fontSize;

	            const character = characters.charAt(
	                Math.floor(Math.random() * characters.length)
	            );

	            // 先頭の文字を白緑に光らせる
	            ctx.shadowBlur = 12;

	            if (Math.random() > 0.92) {
	                ctx.fillStyle = "#ffffff";
	                ctx.shadowColor = "#baffc5";
	            } else {
	                ctx.fillStyle = "#00ff41";
	                ctx.shadowColor = "#00ff41";
	            }

	            ctx.fillText(character, x, y);

	            // 光のにじみを解除
	            ctx.shadowBlur = 0;

	            // 一部の文字を明るい緑で追加表示
	            if (Math.random() > 0.75) {
	                ctx.fillStyle = "#39ff70";
	                ctx.fillText(
	                    characters.charAt(
	                        Math.floor(Math.random() * characters.length)
	                    ),
	                    x,
	                    y - fontSize
	                );
	            }

	            drops[i] += speeds[i];

	            if (y > height && Math.random() > 0.96) {
	                drops[i] = 0;
	                speeds[i] = 0.7 + Math.random() * 1.5;
	            }
	        }
	    }

	    resizeCanvas();
	    window.addEventListener("resize", resizeCanvas);

	    // 画面更新を速めて、雨を強調
	    window.setInterval(drawMatrix, 30);
	})();
	</script>
</body>
</html>
