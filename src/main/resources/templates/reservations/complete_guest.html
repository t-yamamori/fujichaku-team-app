<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約完了 | FUJICHAKU</title>

    <style>
        :root {
            --matrix-green: #00ff41;
            --matrix-dark-green: #008f11;
            --matrix-bg: #000000;
            --matrix-panel: rgba(0, 8, 2, 0.90);
            --matrix-border: rgba(0, 255, 65, 0.7);
            --matrix-text: #d5ffdc;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--matrix-bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 16px;
            background: var(--matrix-bg);
            color: var(--matrix-text);
            font-family: "Consolas", "Courier New", monospace;
        }

        /* デジタルレイン */
        #matrix-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.95;
            filter: brightness(1.5) contrast(1.2);
        }

        .page-content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        /* メインパネル */
        .container {
            padding: 35px;
            background: var(--matrix-panel);
            border: 1px solid var(--matrix-border);
            border-radius: 8px;
            box-shadow:
                0 0 20px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.04);
        }

        .system-label {
            margin: 0 0 12px;
            color: var(--matrix-green);
            font-size: 12px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 8px var(--matrix-green);
        }

        .page-title {
            margin: 0 0 25px;
            color: var(--matrix-green);
            font-size: clamp(26px, 5vw, 36px);
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
            letter-spacing: 3px;
        }

        /* 予約完了メッセージ */
        .success-message {
            margin: 0 0 30px;
            color: var(--matrix-green);
            font-size: 16px;
            line-height: 1.9;
            text-align: center;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        .success-icon {
            display: block;
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            line-height: 54px;
            border: 2px solid var(--matrix-green);
            border-radius: 50%;
            font-size: 32px;
            text-shadow: 0 0 12px var(--matrix-green);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.4);
        }

        /* 注意メッセージ */
        .note {
            margin-bottom: 30px;
            padding: 18px;
            color: #d9ffd9;
            background: rgba(0, 35, 10, 0.92);
            border: 1px solid var(--matrix-dark-green);
            border-left: 4px solid var(--matrix-green);
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.9;
        }

        .note strong {
            display: block;
            margin-bottom: 7px;
            color: var(--matrix-green);
            font-size: 15px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
        }

        /* 予約内容 */
        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin: 0 0 18px;
            padding: 0 0 12px;
            color: var(--matrix-green);
            font-size: 20px;
            border-bottom: 1px solid var(--matrix-border);
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
        }

        .section h2::before {
            content: "> ";
            color: var(--matrix-dark-green);
        }

        .reservation-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            overflow-wrap: anywhere;
        }

        .reservation-table th,
        .reservation-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.25);
            text-align: left;
            line-height: 1.7;
        }

        .reservation-table th {
            width: 32%;
            color: var(--matrix-green);
            background: rgba(0, 255, 65, 0.08);
            font-weight: normal;
        }

        .reservation-table td {
            color: #e1ffe5;
        }

        .reservation-number {
            color: var(--matrix-green);
            font-size: 23px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            color: var(--matrix-green);
            background: rgba(0, 255, 65, 0.06);
            border: 1px solid var(--matrix-dark-green);
            border-radius: 3px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
        }

        /* 店舗一覧へ戻るボタン */
        .top-bar {
            display: flex;
            justify-content: center;
            margin-top: 28px;
        }

        .btn {
            display: inline-block;
            min-width: 200px;
            padding: 14px 24px;
            border: 1px solid var(--matrix-green);
            border-radius: 4px;
            color: var(--matrix-green);
            background: rgba(0, 255, 65, 0.08);
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
            transition:
                background 0.2s,
                box-shadow 0.2s,
                color 0.2s;
        }

        .btn:hover,
        .btn:focus-visible {
            color: #000000;
            background: var(--matrix-green);
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.65);
            outline: none;
        }

        /* RESERVATION COMPLETE 二重ネオン枠 */
        .footer-text {
            display: flex;
            justify-content: center;
            margin: 38px 0 10px;
            text-align: center;
        }

        .complete-frame {
            position: relative;
            display: inline-block;
            max-width: 100%;
            padding: 18px 30px;
            border: 2px solid var(--matrix-green);
            border-radius: 5px;
            background: rgba(0, 15, 3, 0.98);
            color: var(--matrix-green);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
            text-shadow:
                0 0 5px var(--matrix-green),
                0 0 12px var(--matrix-green);
            box-shadow:
                0 0 8px var(--matrix-green),
                0 0 20px rgba(0, 255, 65, 0.65),
                0 0 38px rgba(0, 255, 65, 0.25),
                inset 0 0 12px rgba(0, 255, 65, 0.2);
            animation: neon-pulse 2s ease-in-out infinite;
        }

        .complete-frame::before {
            content: "";
            position: absolute;
            inset: -8px;
            border: 1px solid rgba(0, 255, 65, 0.85);
            border-radius: 7px;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
            pointer-events: none;
        }

        .complete-frame::after {
            content: "";
            position: absolute;
            inset: -13px;
            border-top: 2px solid rgba(0, 255, 65, 0.5);
            border-bottom: 2px solid rgba(0, 255, 65, 0.5);
            pointer-events: none;
        }

        @keyframes neon-pulse {
            0%, 100% {
                box-shadow:
                    0 0 8px #00ff41,
                    0 0 20px rgba(0, 255, 65, 0.55),
                    0 0 38px rgba(0, 255, 65, 0.2),
                    inset 0 0 12px rgba(0, 255, 65, 0.15);
            }

            50% {
                box-shadow:
                    0 0 12px #00ff41,
                    0 0 28px rgba(0, 255, 65, 0.85),
                    0 0 48px rgba(0, 255, 65, 0.35),
                    inset 0 0 18px rgba(0, 255, 65, 0.25);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .container {
                padding: 22px 15px;
            }

            .page-title {
                letter-spacing: 1px;
            }

            .note {
                padding: 14px;
            }

            .reservation-table th,
            .reservation-table td {
                padding: 12px 9px;
                font-size: 13px;
            }

            .reservation-table th {
                width: 34%;
            }

            .reservation-number {
                font-size: 20px;
            }

            .btn {
                width: 100%;
            }

            .complete-frame {
                padding: 14px 12px;
                font-size: 11px;
                letter-spacing: 1px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .complete-frame {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <!-- 背景のデジタルレイン -->
    <canvas id="matrix-canvas"></canvas>

    <main class="page-content">
        <div class="container">

            <p class="system-label">
                FUJICHAKU // RESERVATION SYSTEM
            </p>

            <h1 class="page-title">予約完了</h1>

            <div class="success-message">
                <span class="success-icon">✓</span>
                予約が完了しました。<br>
                ご予約ありがとうございます。
            </div>

            <!-- 非会員向け注意 -->
            <div class="note">
                <strong>WARNING // 非会員のお客様へ</strong>
                非会員の方は予約履歴をご利用いただけません。<br>
                この画面を閉じる前に、予約内容をスクリーンショット等で保存してください。
            </div>

            <!-- 予約内容 -->
            <section class="section">
                <h2>予約内容</h2>

                <table class="reservation-table">
                    <tbody>
                        <tr>
                            <th>予約番号</th>
                            <td>
                                <strong
                                    class="reservation-number"
                                    th:text="${reservation.id}">100</strong>
                            </td>
                        </tr>

                        <tr>
                            <th>店舗</th>
                            <td th:text="${store.name}">店舗名</td>
                        </tr>

                        <tr>
                            <th>予約日時</th>
                            <td th:text="${#temporals.format(reservation.reservationDate, 'yyyy年MM月dd日 HH:mm')}">
                                2026年10月07日 18:00
                            </td>
                        </tr>

                        <tr>
                            <th>人数</th>
                            <td>
                                <span th:text="${reservation.number}">2</span> 名
                            </td>
                        </tr>

                        <tr>
                            <th>状況</th>
                            <td>
                                <span
                                    class="status"
                                    th:text="${reservation.status}">予約済み</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <!-- 店舗一覧へ戻る -->
            <div class="top-bar">
                <a class="btn" th:href="@{/shops}">
                    &gt; 店舗一覧へ戻る
                </a>
            </div>

            <!-- 完了メッセージ -->
            <div class="footer-text">
                <span class="complete-frame">
                    &gt;&gt; RESERVATION COMPLETE &lt;&lt;
                </span>
            </div>

        </div>
    </main>

    <!-- Matrix Digital Rain -->
    <script>
        (() => {
            const canvas = document.getElementById("matrix-canvas");

            if (!canvas) {
                return;
            }

            const ctx = canvas.getContext("2d");

            if (!ctx) {
                return;
            }

            /* 流れる文字：日本語・予約関連・サイバー系英単語 */
            const characters =
                "アイウエオカキクケコサシスセソタチツテトナニヌネノ" +
                "ハヒフヘホマミムメモヤユヨラリルレロワヲン" +
                "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&" +
                "reservation" + "reserve" + "FUJICHAKU" +
                "予約" + "yoyaku" + "ウォッカ" + "Vodka" +
                "完了" + "予約完了" + "不時着" + "不時着しました" +
                "SYSTEM" + "ACCESS" + "DATABASE" + "NETWORK" +
                "DIGITAL" + "CYBER" + "MATRIX" + "PROTOCOL" +
                "ENCRYPT" + "DECRYPT" + "TERMINAL" + "SERVER" +
                "CLIENT" + "ADMIN" + "LOGIN" + "LOGOUT" +
                "SUCCESS" + "ERROR" + "WARNING" + "PROCESS" +
                "EXECUTE" + "INITIALIZE" + "CONNECT" + "DISCONNECT" +
                "SECURITY" + "FIREWALL" + "PASSWORD" + "AUTHENTICATION" +
                "ACCESS GRANTED" + "ACCESS DENIED" + "LOADING" +
                "COMPLETE" + "CONFIRM" + "CANCEL" + "UPDATE" +
                "DELETE" + "SEARCH" + "REGISTER" + "MANAGEMENT" +
                "BOOKING" + "SCHEDULE" + "CUSTOMER" + "STORE" +
                "MEMBER" + "GUEST" + "MANAGER" + "RESERVED" +
                "CONFIRMED" + "TRANSACTION" + "OPERATION" +
                "SHADOW" + "GHOST" + "DARKNESS" + "UNKNOWN" +
                "CLASSIFIED" + "TOP SECRET" + "BLACKOUT" +
                "UNDERGROUND" + "FREAKSHOW" + "CHAOS" + "GLITCH" +
                "VOID" + "PHANTOM" + "OBLIVION" + "NIGHTMARE" +
                "REBOOT" + "OVERRIDE" + "RESTRICTED" + "WARNING" +
                "2026" + "10-15" + "SYSTEM ONLINE" + "END TRANSMISSION" +
                "ACCESS GRANTED" + "RESERVATION COMPLETE" +
                "NO SIGNAL" + "UNKNOWN USER" + "DATA STREAM";

            const fontSize = 16;

            let columns = 0;
            let drops = [];
            let speeds = [];
            let animationId = null;

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const width = window.innerWidth;
                const height = window.innerHeight;

                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                columns = Math.ceil(width / fontSize);

                drops = Array.from(
                    { length: columns },
                    () => Math.random() * -(height / fontSize)
                );

                speeds = Array.from(
                    { length: columns },
                    () => 0.7 + Math.random() * 1.5
                );

                /* リサイズ直後の背景を黒く初期化 */
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, width, height);
            }

            function drawMatrix() {
                const width = window.innerWidth;
                const height = window.innerHeight;

                /* 文字の軌跡を残す */
                ctx.fillStyle = "rgba(0, 0, 0, 0.045)";
                ctx.fillRect(0, 0, width, height);

                ctx.font = "bold " + fontSize + "px monospace";
                ctx.textBaseline = "top";

                for (let i = 0; i < drops.length; i++) {
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    const character = characters.charAt(
                        Math.floor(Math.random() * characters.length)
                    );

                    /* 文字を発光させる */
                    ctx.shadowBlur = 12;

                    if (Math.random() > 0.92) {
                        ctx.fillStyle = "#ffffff";
                        ctx.shadowColor = "#baffc5";
                    } else {
                        ctx.fillStyle = "#00ff41";
                        ctx.shadowColor = "#00ff41";
                    }

                    ctx.fillText(character, x, y);

                    ctx.shadowBlur = 0;

                    /* 明るい緑色の文字を追加 */
                    if (Math.random() > 0.75) {
                        ctx.fillStyle = "#39ff70";

                        ctx.fillText(
                            characters.charAt(
                                Math.floor(Math.random() * characters.length)
                            ),
                            x,
                            y - fontSize
                        );
                    }

                    drops[i] += speeds[i];

                    if (y > height && Math.random() > 0.96) {
                        drops[i] = 0;
                        speeds[i] = 0.7 + Math.random() * 1.5;
                    }
                }

                animationId = window.requestAnimationFrame(drawMatrix);
            }

            resizeCanvas();

            window.addEventListener("resize", resizeCanvas);

            /* 二重起動を防止してアニメーションを開始 */
            if (animationId !== null) {
                window.cancelAnimationFrame(animationId);
            }

            drawMatrix();
        })();
    </script>
</body>
</html>
