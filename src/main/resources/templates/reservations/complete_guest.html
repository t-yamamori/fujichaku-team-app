<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約完了 | FUJICHAKU</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title">予約完了</h1>

    <p class="result-count">予約が完了しました。ご予約ありがとうございます。</p>

    <!-- 非会員向け注意 -->
    <div class="note">
        <strong>非会員のお客様へ</strong><br>
        非会員の方は予約履歴をご利用いただけません。<br>
        この画面を閉じる前に、予約内容をスクリーンショット等で保存してください。
    </div>

    <!-- 予約内容 -->
    <section class="section">
        <h2>予約内容</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>予約番号</th><td><strong th:text="${reservation.id}">100</strong></td></tr>
                <tr><th>店舗</th><td th:text="${store.name}">店舗名</td></tr>
                <tr><th>予約日時</th><td th:text="${#temporals.format(reservation.reservationDate, 'yyyy年MM月dd日 HH:mm')}">2026年10月07日 18:00</td></tr>
                <tr><th>人数</th><td><span th:text="${reservation.number}">2</span> 名</td></tr>
                <tr><th>状況</th><td th:text="${reservation.status}">予約済み</td></tr>
            </tbody>
        </table>
    </section>

    <div class="top-bar">
        <a class="btn btn-secondary" th:href="@{/shops}">店舗一覧へ</a>
    </div>

</div>
</body>
</html>
