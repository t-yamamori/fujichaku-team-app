<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約 - [[${store.name}]]</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title">店舗予約</h1>

    <div class="top-bar">
        <a class="btn btn-secondary" th:href="@{/shops/{shopId}(shopId=${store.id})}">店舗詳細へ</a>
        <a class="btn btn-secondary" th:href="@{/shops}">店舗一覧へ</a>
    </div>

    <!-- 入力エラー -->
    <p class="note" style="color: #b71c1c;" th:if="${error != null}" th:text="${error}">エラー</p>

    <!-- 店舗情報 -->
    <section class="section">
        <div class="shop-detail">
            <div>
                <img th:if="${store.pictureUrl != null}" th:src="${store.pictureUrl}" th:alt="${store.name}"
                     onerror="this.style.display='none';">
                <div th:unless="${store.pictureUrl != null}" class="no-image">No Image</div>
            </div>
            <dl>
                <dt>店舗名</dt> <dd th:text="${store.name}">店舗名</dd>
                <dt>代表者</dt> <dd th:text="${store.representative}">代表者</dd>
                <dt>住所</dt>   <dd th:text="${store.address}">住所</dd>
                <dt>連絡先</dt> <dd th:text="${store.mail}">mail</dd>
                <dt>説明</dt>   <dd th:text="${store.description}">説明</dd>
            </dl>
        </div>
    </section>

    <!-- 予約内容の入力（POST /shops/{shopId}/reservations/confirm） -->
    <section class="section">
        <h2>予約内容を入力</h2>

        <form method="post" th:action="@{/shops/{shopId}/reservations/confirm(shopId=${store.id})}">

            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <table class="reservation-table">
                <tbody>
                    <tr>
                        <th>氏名</th>
                        <td><input type="text" id="name" name="name" placeholder="氏名"></td>
                    </tr>
                    <tr>
                        <th>メールアドレス</th>
                        <td>
                            <input type="email" id="mail" name="mail" placeholder="メールアドレス">
                            <p class="note">※ 会員の方は氏名・メールアドレスの入力は不要です。非会員の方は入力してください。</p>
                        </td>
                    </tr>
                    <tr>
                        <th>日付</th>
                        <td><input type="date" id="reservationDate" name="date" required></td>
                    </tr>
                    <tr>
                        <th>時間</th>
                        <td>
                            <label><input type="radio" name="time" value="10:00" required> 10:00</label>
                            <label><input type="radio" name="time" value="11:00"> 11:00</label>
                            <label><input type="radio" name="time" value="12:00"> 12:00</label>
                            <label><input type="radio" name="time" value="13:00"> 13:00</label>
                            <label><input type="radio" name="time" value="14:00"> 14:00</label>
                            <label><input type="radio" name="time" value="15:00"> 15:00</label>
                            <label><input type="radio" name="time" value="16:00"> 16:00</label>
                            <label><input type="radio" name="time" value="17:00"> 17:00</label>
                            <label><input type="radio" name="time" value="18:00"> 18:00</label>
                        </td>
                    </tr>
                    <tr>
                        <th>人数</th>
                        <td>
                            <select id="numberOfGuests" name="number" required>
                                <option value="">人数を選択してください</option>
                                <option value="1">1名</option>
                                <option value="2">2名</option>
                                <option value="3">3名</option>
                                <option value="4">4名</option>
                                <option value="5">5名</option>
                                <option value="6">6名</option>
                                <option value="7">7名</option>
                                <option value="8">8名</option>
                                <option value="9">9名</option>
                                <option value="10">10名</option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="note">※ 10名以上で予約の場合は、直接店舗にお電話での確認お願いします。</p>
            <p class="note">※ 予約内容をご確認のうえ、「予約内容を確認する」を押してください。</p>

            <button type="submit" class="btn btn-accent btn-block">予約内容を確認する</button>
        </form>
    </section>

    <a class="back-link" th:href="@{/shops/{shopId}(shopId=${store.id})}">← キャンセルして店舗詳細へ戻る</a>

</div>
</body>
</html>
