<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ご予約 | FUJICHAKU</title>

    <style>
        :root {
            --main: #a66a3f;
            --main-dark: #754326;
            --line: #e5d8cc;
            --text: #49382d;
            --text-sub: #806e60;
            --error: #bd3434;
            --card: rgba(255, 255, 255, 0.95);
            --shadow: 0 12px 35px rgba(91, 62, 39, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: var(--text);
            background: linear-gradient(
                180deg,
                #9bd4e7 0%,
                #d8f0f5 38%,
                #fff4df 75%,
                #edc99a 100%
            );
            font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN",
                         Meiryo, sans-serif;
        }

        body::before {
            position: fixed;
            z-index: -3;
            inset: 0;
            content: "";
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 78% 12%,
                    rgba(255, 255, 220, 0.8) 0,
                    rgba(255, 255, 220, 0.25) 9%,
                    transparent 20%
                ),
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.12),
                    rgba(255, 239, 213, 0.18)
                );
        }

        body::after {
            position: fixed;
            z-index: -2;
            right: -10%;
            bottom: -150px;
            left: -10%;
            height: 360px;
            content: "";
            pointer-events: none;
            border-radius: 50% 50% 0 0;
            background: radial-gradient(
                ellipse at 30% 15%,
                #f6dfb6 0,
                #e8bd83 45%,
                #d4a16a 100%
            );
            transform: rotate(-2deg);
            opacity: 0.88;
        }

        .cloud {
            position: fixed;
            z-index: -1;
            width: 130px;
            height: 38px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.56);
            filter: blur(1px);
            pointer-events: none;
            animation: cloudFloat 32s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            position: absolute;
            content: "";
            border-radius: 50%;
            background: inherit;
        }

        .cloud::before {
            top: -24px;
            left: 22px;
            width: 58px;
            height: 58px;
        }

        .cloud::after {
            top: -15px;
            right: 20px;
            width: 45px;
            height: 45px;
        }

        .cloud-one {
            top: 120px;
            left: -180px;
        }

        .cloud-two {
            top: 280px;
            left: -300px;
            transform: scale(0.7);
            animation-delay: -15s;
        }

        @keyframes cloudFloat {
            from { translate: 0 0; }
            to { translate: calc(100vw + 500px) 0; }
        }

        .site-header {
            position: relative;
            z-index: 5;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border-bottom: 1px solid rgba(166, 106, 63, 0.16);
            box-shadow: 0 3px 16px rgba(80, 60, 40, 0.06);
            backdrop-filter: blur(12px);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: min(1180px, calc(100% - 40px));
            min-height: 76px;
            margin: 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: baseline;
            gap: 7px;
            color: var(--main-dark);
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand::after {
            content: "TOWN";
            color: var(--main);
            font-size: 10px;
            letter-spacing: 3px;
        }

        .header-caption {
            color: var(--text-sub);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .page-container {
            position: relative;
            z-index: 1;
            width: min(940px, calc(100% - 32px));
            margin: 0 auto;
            padding: 44px 0 90px;
        }

        .page-heading {
            margin: 0 0 28px;
            text-align: center;
        }

        .page-title {
            margin: 0;
            color: var(--main-dark);
            font-size: clamp(27px, 4vw, 39px);
            font-weight: 900;
            letter-spacing: 3px;
            overflow-wrap: anywhere;
        }

        .page-title::after {
            display: block;
            margin-top: 8px;
            color: var(--main);
            content: "ご予約";
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .page-subtitle {
            margin: 15px 0 0;
            color: #6d655d;
            font-size: 13px;
            line-height: 1.8;
        }

        .content-card {
            min-width: 0;
            margin-bottom: 24px;
            padding: 28px;
            border: 1px solid rgba(166, 106, 63, 0.15);
            border-radius: 20px;
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 11px;
            margin: 0 0 22px;
            color: var(--main-dark);
            font-size: 19px;
            font-weight: 800;
        }

        .section-title::before {
            flex: 0 0 5px;
            width: 5px;
            height: 25px;
            border-radius: 5px;
            background: var(--main);
            content: "";
        }

        .store-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 22px;
            min-width: 0;
        }

        .store-image {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 14px;
            background: #f2e7da;
        }

        .store-name {
            margin: 0 0 17px;
            color: var(--main-dark);
            font-size: clamp(21px, 3vw, 27px);
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .store-detail-list {
            display: grid;
            gap: 12px;
            margin: 0;
        }

        .store-detail-row {
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr);
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0e7df;
        }

        .store-detail-row:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .store-detail-row dt {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 700;
        }

        .store-detail-row dd {
            min-width: 0;
            margin: 0;
            color: var(--text);
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .error-message {
            margin: 0 0 22px;
            padding: 15px 18px;
            border: 1px solid #edb6b6;
            border-radius: 12px;
            color: var(--error);
            background: #fff1f1;
            font-size: 14px;
            line-height: 1.7;
        }

        .reservation-form {
            display: grid;
            gap: 25px;
            min-width: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            min-width: 0;
        }

        .form-group {
            min-width: 0;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 9px;
            color: var(--text);
            font-size: 14px;
            font-weight: 800;
        }

        .required-label {
            display: inline-block;
            margin-left: 7px;
            padding: 3px 7px;
            border-radius: 5px;
            color: #fff;
            background: var(--main);
            font-size: 10px;
            font-weight: 700;
            vertical-align: 2px;
        }

        .form-control {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #d9c9ba;
            border-radius: 10px;
            outline: none;
            color: var(--text);
            background: #fff;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--main);
            box-shadow: 0 0 0 3px rgba(166, 106, 63, 0.13);
        }

        .form-control[readonly] {
            color: #76665a;
            background: #f7f2ed;
            cursor: default;
        }

        .form-help {
            margin: 8px 0 0;
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1.7;
        }

        .number-control {
            max-width: 240px;
        }

        .time-section {
            padding-top: 22px;
            border-top: 1px solid #eee3d9;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .time-option {
            position: relative;
            display: block;
            min-width: 0;
            cursor: pointer;
        }

        .time-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .time-option span {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 9px 5px;
            border: 1px solid #ddcdbf;
            border-radius: 9px;
            color: #604d3e;
            background: #fff;
            font-size: 13px;
            font-weight: 700;
            transition: color 0.2s ease,
                        background 0.2s ease,
                        border-color 0.2s ease,
                        transform 0.2s ease;
        }

        .time-option:hover span {
            border-color: var(--main);
            transform: translateY(-1px);
        }

        .time-option input:checked + span {
            border-color: var(--main);
            color: #fff;
            background: var(--main);
            box-shadow: 0 4px 12px rgba(166, 106, 63, 0.2);
        }

        .time-option input:focus-visible + span {
            outline: 3px solid rgba(166, 106, 63, 0.3);
            outline-offset: 3px;
        }

        .member-name {
            display: flex;
            align-items: center;
            min-height: 48px;
            padding: 12px 15px;
            border: 1px solid #e5d3c2;
            border-radius: 10px;
            color: var(--main-dark);
            background: #fbf4ec;
            font-size: 15px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-top: 6px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 13px 25px;
            border: 1px solid transparent;
            border-radius: 999px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.5;
            cursor: pointer;
            transition: transform 0.2s ease,
                        background 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            color: #fff;
            background: var(--main);
            box-shadow: 0 6px 16px rgba(166, 106, 63, 0.23);
        }

        .button-primary:hover {
            color: #fff;
            background: var(--main-dark);
            box-shadow: 0 8px 20px rgba(117, 67, 38, 0.24);
        }

        .button-secondary {
            border-color: #d7c5b4;
            color: var(--main-dark);
            background: #fff;
        }

        .button-secondary:hover {
            color: var(--main-dark);
            background: #f8eee5;
        }

        .button-primary:focus-visible,
        .button-secondary:focus-visible {
            outline: 3px solid rgba(166, 106, 63, 0.3);
            outline-offset: 3px;
        }

        .navigation-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 22px;
            margin-top: 26px;
        }

        .navigation-links a {
            color: var(--main-dark);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .navigation-links a:hover {
            color: var(--main);
            text-decoration: underline;
        }

        .site-footer {
            position: relative;
            z-index: 1;
            padding: 25px 20px;
            color: #705640;
            background: rgba(255, 255, 255, 0.55);
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 680px) {
            .header-inner {
                width: calc(100% - 28px);
                min-height: 66px;
            }

            .brand {
                font-size: 21px;
            }

            .header-caption {
                max-width: 120px;
                text-align: right;
                font-size: 10px;
                line-height: 1.6;
            }

            .page-container {
                width: calc(100% - 24px);
                padding-top: 30px;
                padding-bottom: 55px;
            }

            .content-card {
                padding: 21px 17px;
                border-radius: 15px;
            }

            .form-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 19px;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .time-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }

            .time-option span {
                min-height: 43px;
                font-size: 12px;
            }

            .store-detail-row {
                grid-template-columns: 78px minmax(0, 1fr);
                gap: 9px;
            }

            .form-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .number-control {
                max-width: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>

    <header class="site-header">
        <div class="header-inner">
            <a class="brand"
               th:href="@{/shops}"
               aria-label="FUJICHAKU 店舗一覧">
                FUJICHAKU
            </a>

            <div class="header-caption">
                あなたのお気に入りのお店を、もっと身近に。
            </div>
        </div>
    </header>

    <main class="page-container">

        <div class="page-heading">
            <h1 class="page-title">RESERVATION FORM</h1>
            <p class="page-subtitle">
                ご希望の日時と人数を選択して、ご予約内容をご確認ください。
            </p>
        </div>

        <div class="error-message"
             role="alert"
             th:if="${error != null}"
             th:text="${error}">
            エラーメッセージ
        </div>

        <div class="error-message"
             role="alert"
             th:if="${errorMessage != null}"
             th:text="${errorMessage}">
            エラーメッセージ
        </div>

        <section class="content-card" aria-labelledby="store-heading">
            <h2 id="store-heading" class="section-title">店舗情報</h2>

            <div class="store-layout">

                <img class="store-image"
                     th:if="${store.pictureUrl != null and !#strings.isEmpty(store.pictureUrl)}"
                     th:src="${store.pictureUrl}"
                     th:alt="${store.name}"
                     loading="eager"
                     onerror="this.style.display='none'">

                <div>
                    <h3 class="store-name" th:text="${store.name}">
                        店舗名
                    </h3>

                    <dl class="store-detail-list">

                        <div class="store-detail-row"
                             th:if="${store.address != null and !#strings.isEmpty(store.address)}">
                            <dt>住所</dt>
                            <dd th:text="${store.address}">店舗住所</dd>
                        </div>

                        <div class="store-detail-row"
                             th:if="${store.phone != null and !#strings.isEmpty(store.phone)}">
                            <dt>電話番号</dt>
                            <dd th:text="${store.phone}">電話番号</dd>
                        </div>

                        <div class="store-detail-row"
                             th:if="${store.description != null and !#strings.isEmpty(store.description)}">
                            <dt>店舗紹介</dt>
                            <dd th:text="${store.description}">店舗紹介</dd>
                        </div>

                    </dl>
                </div>
            </div>
        </section>

        <section class="content-card" aria-labelledby="reservation-heading">

            <h2 id="reservation-heading" class="section-title">
                ご予約内容
            </h2>

            <form class="reservation-form"
                  method="post"
                  th:action="@{/shops/{shopId}/reservations/confirm(shopId=${store.id})}">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-grid">

                    <!-- 会員名 -->
                    <div class="form-group full-width" th:if="${isMember}">
                        <label class="form-label">ご予約者名</label>

                        <div class="member-name"
                             th:text="${memberName != null and !#strings.isEmpty(memberName) ? memberName : '会員情報の名前'}">
                            会員名
                        </div>

                        <p class="form-help">
                            会員情報のお名前を使用します。名前の再入力は不要です。
                        </p>

                        <input type="hidden"
                               name="name"
                               th:value="${memberName}">
                    </div>

                    <!-- ゲスト氏名 -->
                    <div class="form-group full-width" th:unless="${isMember}">
                        <label for="guestName" class="form-label">
                            ご予約者名
                            <span class="required-label">必須</span>
                        </label>

                        <input type="text"
                               id="guestName"
                               name="name"
                               class="form-control"
                               th:value="${name}"
                               placeholder="例：山田 太郎"
                               maxlength="100"
                               autocomplete="name"
                               required>
                    </div>

                    <!-- ゲストメール：Controllerのmailと名前を一致させる -->
                    <div class="form-group full-width" th:unless="${isMember}">
                        <label for="guestEmail" class="form-label">
                            メールアドレス
                            <span class="required-label">必須</span>
                        </label>

                        <input type="email"
                               id="guestEmail"
                               name="mail"
                               class="form-control"
                               th:value="${mail}"
                               placeholder="例：example@example.com"
                               maxlength="254"
                               autocomplete="email"
                               required>

                        <p class="form-help">
                            ご予約に関する連絡に使用するメールアドレスを入力してください。
                        </p>
                    </div>

                    <!-- 予約日 -->
                    <div class="form-group">
                        <label for="reservationDate" class="form-label">
                            ご予約日
                            <span class="required-label">必須</span>
                        </label>

                        <input type="date"
                               id="reservationDate"
                               name="date"
                               class="form-control"
                               th:value="${date}"
                               required>

                        <p class="form-help">
                            本日以降の日付を選択してください。
                        </p>
                    </div>

                    <!-- 予約人数 -->
                    <div class="form-group">
                        <label for="number" class="form-label">
                            ご利用人数
                            <span class="required-label">必須</span>
                        </label>

                        <select id="number"
                                name="number"
                                class="form-control number-control"
                                required>

                            <option value="">人数を選択</option>

                            <option th:each="i : ${#numbers.sequence(1, 10)}"
                                    th:value="${i}"
                                    th:text="${i + '名'}"
                                    th:selected="${number != null and number == i}">
                                1名
                            </option>
                        </select>
                    </div>

                    <!-- 予約時間 -->
                    <div class="form-group full-width time-section">
                        <label class="form-label">
                            ご予約時間
                            <span class="required-label">必須</span>
                        </label>

                        <p class="form-help"
                           style="margin-top: -2px; margin-bottom: 15px;">
                            ご希望の時間を1つ選択してください。
                        </p>

                        <div class="time-grid">

                            <label class="time-option"
                                   th:each="i : ${#numbers.sequence(22, 43)}"
                                   th:with="t=${T(java.lang.String).format('%02d:%02d', i / 2, (i % 2) * 30)}">

                                <input type="radio"
                                       name="time"
                                       th:value="${t}"
                                       th:checked="${time != null and time == t}"
                                       required>

                                <span th:text="${t}">11:00</span>
                            </label>

                        </div>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">
                        予約内容を確認する
                    </button>

                    <a class="button button-secondary"
                       th:href="@{/shops}">
                        店舗一覧へ戻る
                    </a>
                </div>

            </form>

            <nav class="navigation-links" aria-label="関連ページ">

                <a th:if="${isMember}"
                   th:href="@{/reservations/history}">
                    予約履歴を見る
                </a>

                <a th:unless="${isMember}"
                   th:href="@{/register/register}">
                    会員登録はこちら
                </a>

            </nav>

        </section>

    </main>

    <footer class="site-footer">
        <p>© FUJICHAKU TOWN</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dateInput = document.getElementById("reservationDate");

            if (!dateInput) {
                return;
            }

            function getLocalDateString() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, "0");
                const day = String(now.getDate()).padStart(2, "0");

                return year + "-" + month + "-" + day;
            }

            function validateDate() {
                const today = getLocalDateString();

                dateInput.min = today;

                if (dateInput.value && dateInput.value < today) {
                    dateInput.setCustomValidity(
                        "過去の日付は選択できません。"
                    );
                } else {
                    dateInput.setCustomValidity("");
                }
            }

            validateDate();

            dateInput.addEventListener("change", validateDate);
            dateInput.addEventListener("input", validateDate);
        });
    </script>

</body>
</html>
