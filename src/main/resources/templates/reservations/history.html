<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約履歴 | FUJICHAKU</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family:
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 85% 15%,
            rgba(76, 139, 89, 0.06),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f4f5f2,
            #eef0ed
        );

    color: #333;
    min-height: 100vh;
    position: relative;
}

/* =========================================================
   MATRIX BINARY BACKGROUND
========================================================= */

body::before {
    content:
        "01001001 01001110 01000110 01001111 01010010 01001101 01000001 01010100 01001001 01001111 01001110";

    position: fixed;
    top: 90px;
    right: 20px;

    width: 360px;
    height: 600px;

    color: rgba(76, 139, 89, 0.035);

    font-family: monospace;
    font-size: 13px;
    line-height: 2.1;

    letter-spacing: 3px;

    white-space: normal;
    word-break: break-all;

    pointer-events: none;
    z-index: 0;
}

/* =========================================================
   HEADER
   薄いブラウン＋控えめな汚れ感
========================================================= */

.header {
    position: relative;

    height: 96px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background:
        radial-gradient(
            ellipse at 20% 35%,
            rgba(255, 255, 255, 0.08),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 75% 65%,
            rgba(80, 48, 28, 0.08),
            transparent 35%
        ),
        linear-gradient(
            90deg,
            #6b5140,
            #795d48,
            #80634d,
            #735741,
            #684d3b
        );

    border-bottom: 3px solid #66876d;

    box-shadow:
        0 3px 12px rgba(60, 45, 35, 0.12);

    overflow: hidden;

    z-index: 2;
}

/* 薄い汚れ・経年感 */

.header::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 12% 40%,
            rgba(55, 37, 26, 0.08),
            transparent 22%
        ),
        radial-gradient(
            ellipse at 48% 65%,
            rgba(255, 255, 255, 0.06),
            transparent 25%
        ),
        radial-gradient(
            ellipse at 88% 30%,
            rgba(55, 37, 26, 0.07),
            transparent 22%
        );

    opacity: 0.65;

    pointer-events: none;
}

/* ごく薄い表面テクスチャ */

.header::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            115deg,
            transparent 0,
            transparent 18px,
            rgba(255,255,255,0.018) 19px,
            transparent 20px
        );

    pointer-events: none;
}

/* =========================================================
   LOGO
========================================================= */

.logo {
    position: relative;
    z-index: 1;

    color: #f5eee4;

    font-size: 29px;
    font-weight: 800;

    letter-spacing: 5px;

    text-shadow:
        0 1px 2px rgba(40, 25, 15, 0.25);
}

.header-title {
    position: relative;
    z-index: 1;

    color: #dce8dc;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 4px;

    opacity: 0.9;
}

/* =========================================================
   MAIN
========================================================= */

.container {
    position: relative;
    z-index: 1;

    width: min(1100px, 90%);

    margin: 65px auto 80px;
}

/* =========================================================
   PAGE TITLE
========================================================= */

.page-title {
    margin-bottom: 32px;
}

.page-title h1 {
    margin: 0;

    color: #252525;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: 2px;
}

.page-title h1::after {
    content: "";

    display: block;

    width: 55px;
    height: 3px;

    margin-top: 12px;

    background: #64856b;
}

.page-title p {
    margin: 13px 0 0;

    color: #63816a;

    font-family: monospace;

    font-size: 12px;

    letter-spacing: 3px;
}

/* =========================================================
   HISTORY CARD
========================================================= */

.history-card {
    position: relative;

    background: rgba(255, 255, 255, 0.96);

    border: 1px solid #dedfdc;

    border-radius: 3px;

    box-shadow:
        0 8px 28px rgba(50, 55, 50, 0.08);

    overflow: hidden;
}

.history-card::before {
    content: "";

    display: block;

    height: 4px;

    background:
        linear-gradient(
            90deg,
            #6c5240 0%,
            #6c5240 30%,
            #66876d 30%,
            #66876d 55%,
            #d4d7d3 55%,
            #d4d7d3 100%
        );
}

/* =========================================================
   TABLE
========================================================= */

.reservation-table {
    width: 100%;

    border-collapse: collapse;

    background: #fff;
}

.reservation-table th {
    padding: 19px 18px;

    background: #f1f2f0;

    color: #555;

    font-size: 13px;
    font-weight: 700;

    text-align: left;

    letter-spacing: 1px;

    border-bottom: 1px solid #dcdedb;
}

.reservation-table td {
    padding: 20px 18px;

    color: #444;

    font-size: 14px;

    border-bottom: 1px solid #e7e8e5;

    vertical-align: middle;
}

.reservation-table tbody tr {
    transition:
        background 0.2s ease;
}

.reservation-table tbody tr:hover {
    background: #f7f9f6;
}

.reservation-table tbody tr:last-child td {
    border-bottom: none;
}

/* =========================================================
   RESERVATION NUMBER
========================================================= */

.reservation-number {
    color: #66856c !important;

    font-family: monospace;

    font-size: 15px !important;
    font-weight: 700;

    letter-spacing: 1px;
}

/* =========================================================
   STATUS
========================================================= */

.status {
    display: inline-block;

    padding: 5px 12px;

    border-radius: 20px;

    background: #edf3ee;

    color: #5e7d64;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 1px;
}

/* =========================================================
   STORE NAME
========================================================= */

.store-name {
    color: #665344 !important;

    font-weight: 600;
}

/* =========================================================
   NO RESERVATION
========================================================= */

.no-reservation {
    padding: 65px 20px !important;

    color: #888 !important;

    text-align: center;

    font-size: 14px !important;

    letter-spacing: 1px;
}

/* =========================================================
   BACK BUTTON
========================================================= */

.back-area {
    margin-top: 30px;

    text-align: left;
}

.back-button {
    display: inline-flex;

    align-items: center;
    gap: 10px;

    padding: 13px 22px;

    background: #735744;

    color: #f7f1e9;

    text-decoration: none;

    border-radius: 3px;

    font-size: 13px;
    font-weight: 600;

    letter-spacing: 1px;

    box-shadow:
        0 3px 8px rgba(70, 50, 35, 0.12);

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.back-button::before {
    content: "←";

    color: #a9c1ad;

    font-size: 15px;
}

.back-button:hover {
    background: #624936;

    transform: translateY(-1px);
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: relative;

    padding: 25px 20px;

    background:
        linear-gradient(
            90deg,
            #6c5140,
            #795d48,
            #6d5240
        );

    border-top: 2px solid #718b75;

    color: #e9dfd3;

    text-align: center;

    font-family: monospace;

    font-size: 10px;

    letter-spacing: 3px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 768px) {

    .header {
        height: 82px;
        padding: 0 5%;
    }

    .logo {
        font-size: 21px;
        letter-spacing: 3px;
    }

    .header-title {
        display: none;
    }

    .container {
        width: 94%;
        margin-top: 40px;
    }

    .page-title h1 {
        font-size: 28px;
    }

    .history-card {
        overflow-x: auto;
    }

    .reservation-table {
        min-width: 720px;
    }

    .back-area {
        text-align: center;
    }
}

</style>

</head>

<body>

<header class="header">

<div class="logo">
    FUJICHAKU
</div>

<div class="header-title">
    RESERVATION HISTORY
</div>

</header>

<main class="container">

<div class="page-title">

    <h1>
        予約履歴
    </h1>

    <p>
        RESERVATION HISTORY
    </p>

</div>


<div class="history-card">

    <table class="reservation-table">

        <thead>
            <tr>
                <th>予約番号</th>
                <th>予約日時</th>
                <th>人数</th>
                <th>状況</th>
                <th>店舗</th>
            </tr>
        </thead>


        <tbody>

            <tr th:if="${#lists.isEmpty(reservations)}">

                <td colspan="5"
                    class="no-reservation">

                    予約履歴はありません

                </td>

            </tr>


            <tr th:each="reservation : ${reservations}">

                <td class="reservation-number"
                    th:text="${reservation.id}">
                </td>


                <td th:text="${#temporals.format(
                    reservation.reservationDate,
                    'yyyy/MM/dd HH:mm'
                )}">
                </td>


                <td th:text="${reservation.number}">
                </td>


                <td>

                    <span class="status"
                          th:text="${reservation.status}">
                    </span>

                </td>


                <td class="store-name"
                    th:text="${storeNames[reservation.id]}">
                </td>

            </tr>

        </tbody>

    </table>

</div>


<div class="back-area">

    <a class="back-button"
       th:href="@{/shops}">

        店舗一覧へ戻る

    </a>

</div>

</main>

<footer class="footer">

FUJICHAKU RESERVATION SYSTEM

</footer>

</body>
</html>
