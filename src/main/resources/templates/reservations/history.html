<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>予約履歴 - FUJICHAKU</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            color: #f5f5f5;
            font-family:
                "Noto Serif JP",
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            width: 100%;
            min-height: 80px;
            padding: 15px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #090909;
            border-bottom: 1px solid #292929;
        }

        .logo {
            color: #d4af37;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .header-link {
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .header-link:hover {
            color: #d4af37;
        }

        /* MAIN */

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 30px 100px;
        }

        /* TITLE */

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            color: #d4af37;
            font-size: 32px;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        .page-header p {
            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .result-count {
            color: #aaa;
            font-size: 13px;
            text-align: right;
            margin-bottom: 15px;
        }

        .result-count span {
            color: #d4af37;
            font-weight: bold;
        }

        /* HISTORY CARD */

        .history-card {
            background: #101010;
            border: 1px solid #292929;
            padding: 30px;
        }

        /* TABLE */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th {
            padding: 18px 15px;
            background: #0a0a0a;
            border-bottom: 1px solid #d4af37;
            color: #d4af37;
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 2px;
            text-align: left;
            white-space: nowrap;
        }

        .history-table td {
            padding: 20px 15px;
            border-bottom: 1px solid #292929;
            color: #ddd;
            font-size: 14px;
            white-space: nowrap;
        }

        .history-table tbody tr {
            transition: background 0.3s;
        }

        .history-table tbody tr:hover {
            background: #151515;
        }

        .history-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* RESERVATION NUMBER */

        .reservation-id {
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* STATUS */

        .status {
            color: #d4af37;
        }

        /* DETAIL BUTTON */

        .detail-button {
            display: inline-block;
            padding: 9px 18px;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .detail-button:hover {
            background: #d4af37;
            color: #080808;
        }

        /* NO RESERVATION */

        .no-reservation {
            padding: 60px 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
            letter-spacing: 2px;
            line-height: 2;
        }

        /* BACK BUTTON */

        .back-area {
            text-align: center;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            padding: 14px 35px;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #d4af37;
            color: #080808;
        }

        /* FOOTER */

        .footer-text {
            margin-top: 50px;
            color: #555;
            font-size: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {
            header {
                min-height: 70px;
                padding: 15px 20px;
            }

            .logo {
                font-size: 18px;
                letter-spacing: 3px;
            }

            main {
                padding: 50px 15px 70px;
            }

            .page-header h1 {
                font-size: 24px;
                letter-spacing: 3px;
            }

            .history-card {
                padding: 15px;
            }

            .history-table {
                min-width: 650px;
            }

            .history-table th,
            .history-table td {
                padding: 15px 12px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 15px;
            }

            .logo {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .header-link {
                font-size: 12px;
                letter-spacing: 1px;
            }

            main {
                padding: 40px 10px 50px;
            }

            .page-header {
                margin-bottom: 35px;
            }

            .page-header h1 {
                font-size: 21px;
                letter-spacing: 2px;
            }

            .history-card {
                padding: 12px;
            }

            .result-count {
                font-size: 12px;
            }

            .back-button {
                padding: 12px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <div class="logo">FUJICHAKU</div>

        <a th:href="@{/shops}" class="header-link">
            店舗一覧
        </a>
    </header>

    <!-- MAIN -->

    <main>

        <!-- PAGE HEADER -->

        <section class="page-header">
            <h1>Reservation History</h1>
            <p>予約履歴</p>
        </section>

        <!-- HISTORY -->

        <section class="history-card">

            <!-- 予約件数 -->

            <div class="result-count">
                予約件数：
                <span
                    th:text="${reservations != null ? #lists.size(reservations) : 0}">
                    0
                </span>件
            </div>

            <!-- 予約が存在する場合 -->

            <div
                class="table-wrapper"
                th:if="${reservations != null and !#lists.isEmpty(reservations)}">

                <table class="history-table">

                    <thead>
                        <tr>
                            <th>予約番号</th>
                            <th>予約日時</th>
                            <th>人数</th>
                            <th>状況</th>
                            <th>詳細</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="reservation : ${reservations}">

                            <!-- 予約番号 -->

                            <td>
                                <span
                                    class="reservation-id"
                                    th:text="${reservation.id}">
                                    000000
                                </span>
                            </td>

                            <!-- 予約日時 -->

                            <td
                                th:text="${#temporals.format(reservation.reservationDate, 'yyyy/MM/dd HH:mm')}">
                                2026/10/07 18:00
                            </td>

                            <!-- 予約人数 -->

                            <td th:text="${reservation.number + '名'}">
                                2名
                            </td>

                            <!-- 予約状況 -->

                            <td>
                                <span
                                    class="status"
                                    th:text="${reservation.status}">
                                    予約済み
                                </span>
                            </td>

                            <!-- 予約詳細 -->

                            <td>
                                <a
                                    th:href="@{/reservations/{reservationId}(reservationId=${reservation.id})}"
                                    class="detail-button">
                                    確認
                                </a>
                            </td>

                        </tr>

                    </tbody>
                </table>

            </div>

            <!-- 予約がない場合 -->

            <div
                class="no-reservation"
                th:if="${reservations == null or #lists.isEmpty(reservations)}">

                現在、予約履歴はありません。

            </div>

        </section>

        <!-- BACK -->

        <div class="back-area">
            <a
                th:href="@{/shops}"
                class="back-button">
                店舗一覧へ戻る
            </a>
        </div>

        <div class="footer-text">
            FUJICHAKU — RESERVATION MANAGEMENT
        </div>

    </main>

</body>
</html>
