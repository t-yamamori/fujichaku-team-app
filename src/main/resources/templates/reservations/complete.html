
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約完了 | FUJICHAKU</title>

    <!-- 非会員向け予約完了画面と共通のCSSを使用 -->
    <link rel="stylesheet" th:href="@{/css/completeGuest.css}">
</head>

<body>
    <main class="page-content">
        <div class="container">

            <p class="system-label">
                FUJICHAKU // RESERVATION SYSTEM
            </p>

            <h1 class="page-title">予約完了</h1>

            <div class="success-message">
                <span class="success-icon">✓</span>
                予約が完了しました。<br>
                ご予約ありがとうございます。
            </div>

            <!-- 予約内容 -->
            <section class="section">
                <h2>予約内容</h2>

                <table class="reservation-table">
                    <tbody>
                        <tr>
                            <th scope="row">予約番号</th>
                            <td>
                                <strong
                                    class="reservation-number"
                                    th:text="${reservation.id}">
                                    100
                                </strong>
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">お名前</th>
                            <td th:text="${reservationName}">
                                山田 太郎
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">メールアドレス</th>
                            <td th:text="${reservationMail}">
                                example@example.com
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">店舗</th>
                            <td th:text="${store.name}">
                                店舗名
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">予約日時</th>
                            <td
                                th:text="${#temporals.format(reservation.reservationDate, 'yyyy年MM月dd日 HH:mm')}">
                                2026年10月07日 18:00
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">人数</th>
                            <td>
                                <span th:text="${reservation.number}">2</span> 名
                            </td>
                        </tr>

                        <tr>
                            <th scope="row">状況</th>
                            <td>
                                <span
                                    class="status"
                                    th:text="${reservation.status}">
                                    予約済み
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <!-- 店舗一覧へ戻る -->
            <div class="top-bar">
                <a class="btn" th:href="@{/shops}">
                    &gt; 店舗一覧へ戻る
                </a>
            </div>

            <!-- 予約完了スタンプ -->
            <div class="footer-text">
                <span class="complete-frame">
                    &gt;&gt; RESERVATION COMPLETE &lt;&lt;
                </span>
            </div>

        </div>
    </main>
</body>
</html>
