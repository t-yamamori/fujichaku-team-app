<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約完了 - FUJICHAKU</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title">予約完了</h1>

    <p class="result-count">予約が完了しました。ご予約ありがとうございます。</p>

    <!-- 予約番号 -->
    <section class="section">
        <h2>予約番号</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>予約番号</th><td><strong th:text="${reservation.id}">100</strong></td></tr>
            </tbody>
        </table>
        <p class="note">こちらの予約番号をお控えください。</p>
    </section>

    <!-- 店舗情報 -->
    <section class="section">
        <h2>店舗情報</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>店舗名</th><td th:text="${store.name}">店舗名</td></tr>
                <tr><th>住所</th><td th:text="${store.address}">住所</td></tr>
                <tr><th>連絡先</th><td th:text="${store.mail}">メールアドレス</td></tr>
                <tr><th>代表者</th><td th:text="${store.representative}">代表者</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 予約内容 -->
    <section class="section">
        <h2>予約内容</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>予約日時</th><td th:text="${#temporals.format(reservation.reservationDate, 'yyyy/MM/dd HH:mm')}">2026/10/07 18:00</td></tr>
                <tr><th>人数</th><td><span th:text="${reservation.number}">2</span> 名</td></tr>
                <tr><th>予約状況</th><td th:text="${reservation.status}">予約済み</td></tr>
                <tr><th>予約ID</th><td th:text="${reservation.id}">100</td></tr>
            </tbody>
        </table>
    </section>

    <p class="note">ご来店の際は、予約番号をご確認いただけるようお控えください。</p>

    <div class="top-bar">
        <a class="btn btn-primary" th:href="@{/reservations/history}">予約履歴を見る</a>
        <a class="btn btn-secondary" th:href="@{/shops}">店舗一覧へ</a>
    </div>

</div>
</body>
</html>
