<title>予約完了 | FUJICHAKU</title>

<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
    font-family:"Helvetica Neue","Yu Gothic","Hiragino Kaku Gothic ProN",Arial,sans-serif;
    background:
        radial-gradient(circle at 85% 15%,rgba(76,139,89,.06),transparent 30%),
        linear-gradient(135deg,#f4f5f2,#eef0ed);
    color:#333;min-height:100vh;position:relative;
}
body::before{
    content:"01001001 01001110 01000110 01001111 01010010 01001101 01000001 01010100 01001001 01001111 01001110";
    position:fixed;top:90px;right:20px;width:360px;height:600px;
    color:rgba(76,139,89,.035);font-family:monospace;font-size:13px;line-height:2.1;
    letter-spacing:3px;word-break:break-all;pointer-events:none;z-index:0;
}
.header{
    position:relative;height:96px;display:flex;align-items:center;justify-content:space-between;
    padding:0 7%;
    background:
        radial-gradient(ellipse at 20% 35%,rgba(255,255,255,.08),transparent 35%),
        radial-gradient(ellipse at 75% 65%,rgba(80,48,28,.08),transparent 35%),
        linear-gradient(90deg,#6b5140,#795d48,#80634d,#735741,#684d3b);
    border-bottom:3px solid #66876d;
    box-shadow:0 3px 12px rgba(60,45,35,.12);overflow:hidden;z-index:2;
}
.header::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 12% 40%,rgba(255,255,255,.04),transparent 30%),radial-gradient(ellipse at 82% 60%,rgba(40,25,15,.05),transparent 35%);pointer-events:none}
.logo{position:relative;z-index:1;color:#f5eee4;font-size:29px;font-weight:800;letter-spacing:5px}
.header-title{position:relative;z-index:1;color:#dce8dc;font-size:12px;font-weight:600;letter-spacing:4px}
.container{position:relative;z-index:1;width:min(1100px,90%);margin:65px auto 80px}
.page-title{margin-bottom:35px}
.page-title h1{margin:0;color:#252525;font-size:34px;font-weight:700;letter-spacing:2px}
.page-title h1::after{content:"";display:block;width:55px;height:3px;margin-top:12px;background:#64856b}
.page-title p,.page-title .sub{margin:12px 0 0;color:#63816a;font-family:monospace;font-size:12px;letter-spacing:3px}
.card,.complete-card,.reservation-card,.store-card,.info-card,.history-card{
    background:rgba(255,255,255,.96);border:1px solid #dedfdc;border-radius:3px;
    box-shadow:0 8px 28px rgba(50,55,50,.08);
}
.complete-card,.reservation-card{padding:40px}
.store-card{overflow:hidden}
.store-content{padding:28px}
.store-image{width:100%;height:280px;object-fit:cover;display:block;background:#e8e9e6}
.store-label,.form-label,.info-title,.reservation-number-label,.card-title span{
    color:#66856c;font-size:11px;letter-spacing:3px;font-weight:700
}
.store-name{margin:8px 0 22px;color:#665344;font-size:28px;font-weight:700}
.store-info,.reservation-info{border-top:1px solid #dedfdc}
.info-row,.row{
    display:flex;align-items:center;gap:20px;min-height:60px;
    padding:15px 0;border-bottom:1px solid #e7e8e5
}
.info-row:last-child,.row:last-child{border-bottom:none}
.info-label,.label{width:180px;flex-shrink:0;color:#777;font-size:12px;font-weight:600;letter-spacing:1px}
.info-value,.value{flex:1;color:#444;font-size:14px;line-height:1.7;word-break:break-word}
.reservation-number,.reservation-number-value{color:#66856c;font-family:monospace;font-weight:700;letter-spacing:2px}
.reservation-number{font-size:17px}
.reservation-number-value{font-size:30px;text-align:center}
.status,.reservation-status{
    display:inline-block;padding:6px 12px;background:#edf3ee;color:#5e7d64;
    border-radius:3px;font-size:12px;font-weight:600;letter-spacing:1px
}
.guest-notice,.guest-info{
    margin-bottom:28px;padding:20px;background:#f4f7f3;border:1px solid #d7e1d8;border-radius:3px
}
.guest-notice-title,.guest-title{margin-bottom:9px;color:#5e7d64;font-size:14px;font-weight:700;letter-spacing:2px}
.guest-notice-text,.guest-description{margin:0;color:#666;font-size:13px;line-height:1.8}
.guest-notice-highlight{color:#665344;font-weight:700}
.section-title{margin:0 0 25px;padding-bottom:14px;border-bottom:1px solid #d8ddd8;color:#665344;font-size:20px;letter-spacing:1px}
.form-group{margin-bottom:24px}
input,select{
    width:100%;padding:13px 14px;background:#fff;color:#444;border:1px solid #cfd3cf;
    border-radius:2px;font-size:14px;outline:none
}
input:focus,select:focus{border-color:#66876d;box-shadow:0 0 0 2px rgba(102,135,109,.12)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.time-option{position:relative}
.time-option input{position:absolute;opacity:0;pointer-events:none}
.time-option label{display:block;padding:12px 5px;text-align:center;background:#f5f6f4;border:1px solid #d5d8d4;color:#555;border-radius:2px;cursor:pointer;transition:.2s}
.time-option label:hover{border-color:#66876d;color:#5e7d64;background:#f0f4f0}
.time-option input:checked+label{background:#66876d;color:#fff;border-color:#66876d;font-weight:700}
.error-message{margin-bottom:22px;padding:13px 15px;background:#fff3f1;border-left:3px solid #b84a3a;color:#a13e32;font-size:13px;line-height:1.6}
.notice,.message{
    margin-top:22px;padding:16px;background:#f5f6f3;border-left:3px solid #66876d;
    color:#666;font-size:12px;line-height:1.7
}
.notice p{margin:0 0 8px}.notice p:last-child{margin-bottom:0}
.back-area,.button-area{margin-top:30px;text-align:center}
.back-button,.button{
    display:inline-block;padding:13px 22px;border:0;border-radius:3px;
    background:#735744;color:#f7f1e9;text-decoration:none;font-size:13px;font-weight:600;
    letter-spacing:1px;box-shadow:0 4px 12px rgba(70,55,45,.12);transition:.2s
}
.back-button::before{content:"← ";color:#a9c1ad}
.back-button:hover{background:#624936;transform:translateY(-1px)}
.button-area{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.primary-button{background:#66876d;color:#fff}
.primary-button:hover{background:#57765e}
.secondary-button{background:#735744;color:#f7f1e9}
.cancel-link,.back{display:block;text-align:center;margin-top:15px;color:#66856c;text-decoration:none;font-size:13px}
.cancel-link:hover,.back:hover{color:#4f6d55}
.complete-message{text-align:center;margin-bottom:30px}
.complete-message .mark,.complete-mark{
    width:60px;height:60px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
    border:2px solid #66876d;border-radius:50%;color:#66876d;font-size:27px;font-weight:700
}
.complete-message h2{margin:0;color:#665344;font-size:23px;letter-spacing:2px}
.complete-message p{margin-top:10px;color:#777;font-size:13px}
.information-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card-title{margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid #d8ddd8;color:#665344;font-size:18px}
.complete-card .reservation-number{background:#f3f6f2;border:1px solid #d8e0d8;padding:22px;text-align:center;margin-bottom:25px}
.footer,.footer-note{
    position:relative;padding:25px 20px;background:linear-gradient(90deg,#6c5140,#795d48,#6d5240);
    border-top:2px solid #718b75;color:#e9dfd3;text-align:center;font-family:monospace;font-size:10px;letter-spacing:3px
}
.complete-card .button-area{margin-top:28px}
@media(max-width:850px){
    .header{padding:0 5%}.container{width:94%;margin-top:40px}
    .reservation-layout,.information-layout{grid-template-columns:1fr}
}
@media(max-width:768px){
    .header{height:82px}.logo{font-size:21px;letter-spacing:3px}.header-title{display:none}
    .container{margin-top:40px}.page-title h1{font-size:28px}
    .complete-card,.reservation-card{padding:25px 20px}
    .history-card{overflow-x:auto}.reservation-table{min-width:720px}
}
@media(max-width:600px){
    .info-row,.row{display:block;padding:14px 0}
    .info-label,.label{width:auto;margin-bottom:6px}
    .info-value,.value{text-align:left}
    .time-grid{grid-template-columns:repeat(2,1fr)}
    .button-area{grid-template-columns:1fr}
    .store-image{height:230px}
}

</style>

```

</head>

<body>

```

<!-- =========================

     Header

========================= -->

<header class="header">

    <div class="logo">

        FUJICHAKU

    </div>

    <div class="header-title">

        RESERVATION COMPLETE

    </div>

</header>


<!-- =========================

     Main

========================= -->

<main class="container">

    <div class="page-title">

        <h1>予約完了</h1>

        <p>RESERVATION COMPLETE</p>

    </div>


    <div class="complete-card">

        <!-- 予約完了 -->

        <div class="complete-message">

            <div class="mark">

                ✓

            </div>

            <h2>

                予約が完了しました

            </h2>

            <p>

                ご予約ありがとうございます。

            </p>

        </div>


        <!-- 非会員向け注意 -->

        <div class="guest-notice">

            <div class="guest-notice-title">

                非会員のお客様へ

            </div>

            <p class="guest-notice-text">

                非会員の方は

                <span class="guest-notice-highlight">

                    予約履歴をご利用いただけません。

                </span>

                <br>

                この画面を閉じる前に、

                <span class="guest-notice-highlight">

                    予約内容をスクリーンショット等で保存してください。

                </span>

            </p>

        </div>


        <!-- =========================

             Reservation Information

        ========================= -->

        <div class="reservation-info">


            <!-- 予約番号 -->

            <div class="info-row">

                <div class="info-label">

                    予約番号

                </div>

                <div class="info-value reservation-number"

                     th:text="${reservation.id}">

                </div>

            </div>


            <!-- 店舗 -->

            <div class="info-row">

                <div class="info-label">

                    店舗

                </div>

                <div class="info-value"

                     th:text="${store.name}">

                </div>

            </div>


            <!-- 予約日時 -->

            <div class="info-row">

                <div class="info-label">

                    予約日時

                </div>

                <div class="info-value"

                     th:text="${#temporals.format(

                         reservation.reservationDate,

                         'yyyy年MM月dd日 HH:mm'

                     )}">

                </div>

            </div>


            <!-- 人数 -->

            <div class="info-row">

                <div class="info-label">

                    人数

                </div>

                <div class="info-value">

                    <span th:text="${reservation.number}">

                    </span>

                    名

                </div>

            </div>


            <!-- 状況 -->

            <div class="info-row">

                <div class="info-label">

                    状況

                </div>

                <div class="info-value"

                     th:text="${reservation.status}">

                </div>

            </div>

        </div>


        <!-- 店舗一覧へ戻る -->

        <div class="back-area">

            <a class="back-button"

               th:href="@{/shops}">

                店舗一覧へ戻る

            </a>

        </div>

    </div>

</main>


<!-- =========================

     Footer

========================= -->

<footer class="footer">

    FUJICHAKU RESERVATION SYSTEM

</footer>

```

</html>
