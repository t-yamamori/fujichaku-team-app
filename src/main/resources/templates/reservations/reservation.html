<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>予約確認</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background:
                radial-gradient(
                    circle at top left,
                    #252525 0%,
                    #111 40%,
                    #070707 100%
                );

            color: #f5f5f5;

            font-family:
                "Noto Sans JP",
                "Yu Gothic",
                "Meiryo",
                sans-serif;

            min-height: 100vh;
        }

        .container {

            width: min(800px, 92%);

            margin: 60px auto 80px;
        }

        .title {

            margin-bottom: 35px;
        }

        .sub {

            color: #d4af37;

            font-size: 12px;

            letter-spacing: 4px;

            margin-bottom: 10px;
        }

        h1 {

            margin: 0;

            font-size: 32px;

            letter-spacing: 2px;
        }

        .card {

            background:
                linear-gradient(
                    145deg,
                    #1c1c1c,
                    #0e0e0e
                );

            border:
                1px solid rgba(
                    212,
                    175,
                    55,
                    0.3
                );

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.45);
        }

        .section {

            margin-bottom: 30px;

            padding-bottom: 25px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);
        }

        .section:last-child {

            border-bottom: none;

            margin-bottom: 0;

            padding-bottom: 0;
        }

        h2 {

            color: #d4af37;

            font-size: 18px;

            margin-top: 0;

            margin-bottom: 20px;
        }

        .row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 14px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.06);
        }

        .row:last-child {

            border-bottom: none;
        }

        .label {

            color: #999;
        }

        .value {

            color: #fff;

            text-align: right;

            font-weight: 600;
        }

        .button-area {

            margin-top: 30px;
        }

        button {

            width: 100%;

            padding: 17px;

            border:
                1px solid #d4af37;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #a98219
                );

            color: #090909;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 2px;

            cursor: pointer;
        }

        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(212, 175, 55, 0.25);
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #888;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {

            color: #d4af37;
        }

    </style>

</head>

<body>

<main class="container">

    <div class="title">

        <div class="sub">
            RESERVATION CONFIRM
        </div>

        <h1>
            予約確認
        </h1>

    </div>


    <section class="card">


        <!-- =========================================
             店舗情報
             ========================================= -->

        <div class="section">

            <h2>
                店舗情報
            </h2>


            <div class="row">

                <span class="label">
                    店舗名
                </span>

                <span class="value"
                      th:text="${store.name}">

                    店舗名

                </span>

            </div>


            <div class="row">

                <span class="label">
                    住所
                </span>

                <span class="value"
                      th:text="${store.address}">

                    住所

                </span>

            </div>

        </div>


        <!-- =========================================
             予約内容
             ========================================= -->

        <div class="section">

            <h2>
                予約内容
            </h2>


            <div class="row">

                <span class="label">
                    予約日
                </span>

                <span class="value"
                      th:text="${reservationDate}">

                    2026-10-07

                </span>

            </div>


            <div class="row">

                <span class="label">
                    予約時間
                </span>

                <span class="value"
                      th:text="${reservationTime}">

                    18:00

                </span>

            </div>


            <div class="row">

                <span class="label">
                    人数
                </span>

                <span class="value">

                    <span th:text="${number}">
                        2
                    </span>

                    名

                </span>

            </div>

        </div>


        <!-- =========================================
             最終予約確定
             ========================================= -->

        <form th:action="@{/shops/{shopId}/reservations(shopId=${shopId})}"
              method="post">


            <!-- CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <!-- ★予約日 -->

            <input type="hidden"
                   name="date"
                   th:value="${reservationDate}">


            <!-- ★予約時間 -->

            <input type="hidden"
                   name="time"
                   th:value="${reservationTime}">


            <!-- ★人数 -->

            <input type="hidden"
                   name="number"
                   th:value="${number}">


            <!-- 会員 -->

            <input type="hidden"
                   th:if="${memberId != null}"
                   name="memberId"
                   th:value="${memberId}">


            <!-- 非会員 -->

            <input type="hidden"
                   th:if="${userId != null}"
                   name="userId"
                   th:value="${userId}">


            <div class="button-area">

                <button type="submit">

                    予約を確定する

                </button>

            </div>

        </form>


        <!-- 予約入力へ戻る -->

        <a th:href="@{/shops/{shopId}/reservations/new(shopId=${shopId})}"
           class="back">

            予約内容を変更する

        </a>


        <a th:href="@{/shops}"
           class="back">

            店舗一覧へ戻る

        </a>

    </section>

</main>

</body>

</html>
