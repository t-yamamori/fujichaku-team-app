```html
<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>予約確認</title>
</head>

<body>

<h1>予約確認</h1>

<p>
    以下の内容で予約します。
</p>

<hr>

<!-- 店舗情報 -->
<h2>店舗情報</h2>

<p>
    店舗名：
    <span th:text="${store.name}">
        店舗名
    </span>
</p>

<p>
    住所：
    <span th:text="${store.address}">
        住所
    </span>
</p>

<hr>

<!-- 予約内容 -->
<h2>予約内容</h2>

<p>
    <strong>予約日：</strong>
    <span th:text="${reservationDate}">
        2026-10-07
    </span>
</p>

<p>
    <strong>予約時間：</strong>
    <span th:text="${reservationTime}">
        18:00
    </span>
</p>

<p>
    <strong>人数：</strong>
    <span th:text="${number}">
        2
    </span>
    名
</p>

<hr>

<!-- 最終予約確定 -->
<form th:action="@{/shops/{shopId}/reservations(shopId=${shopId})}"
      method="post">

    <!-- CSRF対策 -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <!-- 予約日 -->
    <input type="hidden"
           name="date"
           th:value="${reservationDate}">

    <!-- 予約時間 -->
    <input type="hidden"
           name="time"
           th:value="${reservationTime}">

    <!-- 人数 -->
    <input type="hidden"
           name="number"
           th:value="${number}">

    <!-- 会員の場合 -->
    <input type="hidden"
           th:if="${memberId != null}"
           name="memberId"
           th:value="${memberId}">

    <!-- 非会員の場合 -->
    <input type="hidden"
           th:if="${userId != null}"
           name="userId"
           th:value="${userId}">

    <button type="submit">
        予約を確定する
    </button>

</form>

<br>

<!-- 予約入力画面に戻る -->
<a th:href="@{/shops/{shopId}/reservations/new(shopId=${shopId})}">
    予約内容を変更する
</a>

<br>

<!-- 店舗一覧 -->
<a th:href="@{/shops}">
    店舗一覧へ戻る
</a>

</body>

</html>
```
