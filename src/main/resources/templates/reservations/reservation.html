<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約確認</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title">予約確認</h1>

    <div class="top-bar">
        <a class="btn btn-secondary" th:href="@{/shops/{shopId}/reservations/new(shopId=${shopId})}">予約内容を変更する</a>
        <a class="btn btn-secondary" th:href="@{/shops}">店舗一覧へ</a>
    </div>

    <!-- 店舗情報 -->
    <section class="section">
        <h2>店舗情報</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>店舗名</th><td th:text="${store.name}">店舗名</td></tr>
                <tr><th>住所</th><td th:text="${store.address}">住所</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 予約者情報（非会員） -->
    <section class="section" th:if="${userId != null}">
        <h2>予約者情報（非会員）</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>氏名</th><td th:text="${userName}">氏名</td></tr>
                <tr><th>メールアドレス</th><td th:text="${userMail}">メールアドレス</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 予約者情報（会員） -->
    <section class="section" th:if="${memberId != null}">
        <h2>予約者情報</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>会員ID</th><td th:text="${memberId}">会員ID</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 予約内容 -->
    <section class="section">
        <h2>予約内容</h2>
        <table class="reservation-table">
            <tbody>
                <tr><th>予約日</th><td th:text="${reservationDate}">2026-10-07</td></tr>
                <tr><th>予約時間</th><td th:text="${reservationTime}">18:00</td></tr>
                <tr><th>人数</th><td><span th:text="${number}">2</span> 名</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 最終確定（POST /shops/{shopId}/reservations） -->
    <form method="post" th:action="@{/shops/{shopId}/reservations(shopId=${shopId})}">

        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- 予約日 -->
        <input type="hidden" name="date" th:value="${reservationDate}">

        <!-- 予約時間 -->
        <input type="hidden" name="time" th:value="${reservationTime}">

        <!-- 人数 -->
        <input type="hidden" name="number" th:value="${number}">

        <!-- 会員：memberIdは表示用として送信 -->
        <input type="hidden" th:if="${memberId != null}" name="memberId" th:value="${memberId}">

        <!-- 非会員：userIdは表示用として送信（Controllerでは最終的にmailから再確認する） -->
        <input type="hidden" th:if="${userId != null}" name="userId" th:value="${userId}">

        <!-- 非会員氏名 -->
        <input type="hidden" th:if="${userName != null}" name="name" th:value="${userName}">

        <!-- 非会員メール -->
        <input type="hidden" th:if="${userMail != null}" name="mail" th:value="${userMail}">

        <!-- 確定ボタン -->
        <button type="submit" class="btn btn-accent btn-block">予約を確定する</button>
    </form>

    <a class="back-link" th:href="@{/shops}">← 店舗一覧へ戻る</a>

</div>
</body>
</html>
