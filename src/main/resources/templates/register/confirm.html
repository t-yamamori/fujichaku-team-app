<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員登録確認 - 不時着タウン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, #252525 0%, #111 45%, #070707 100%);
            color: #f5f5f5;
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            height: 76px;
            padding: 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid #d4af37;
        }

        .logo {
            color: #d4af37;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .login-link {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            color: #d4af37;
        }

        /* メイン */
        .container {
            width: 92%;
            max-width: 700px;
            margin: 60px auto;
        }

        .page-title {
            margin-bottom: 35px;
        }

        .page-title .sub {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 600;
        }

        .page-title p {
            color: #aaa;
            margin-top: 12px;
            font-size: 14px;
        }

        /* 確認カード */
        .confirm-card {
            background: linear-gradient(145deg, #1d1d1d, #111);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
        }

        /* 確認項目 */
        .confirm-item {
            display: flex;
            padding: 17px 0;
            border-bottom: 1px solid #333;
        }

        .confirm-item:last-child {
            border-bottom: none;
        }

        .confirm-label {
            width: 180px;
            color: #d4af37;
            font-weight: 600;
        }

        .confirm-value {
            flex: 1;
            color: #f5f5f5;
            word-break: break-word;
        }

        /* ボタン */
        .button-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }

        .button {
            min-width: 150px;
            padding: 13px 25px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .register-button {
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #111;
            border: none;
        }

        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .back-button {
            background: transparent;
            color: #ccc;
            border: 1px solid #555;
        }

        .back-button:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        /* スマホ */
        @media (max-width: 600px) {

            .header {
                padding: 0 20px;
            }

            .container {
                margin: 40px auto;
            }

            .confirm-card {
                padding: 25px 20px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .confirm-item {
                display: block;
            }

            .confirm-label {
                width: auto;
                margin-bottom: 7px;
                display: block;
            }

            .button-area {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="logo">不時着タウン</div>

        <a th:href="@{/login}" class="login-link">
            ログイン
        </a>
    </header>


    <!-- メイン -->
    <main class="container">

        <div class="page-title">
            <div class="sub">REGISTRATION CONFIRMATION</div>
            <h1>会員登録確認</h1>
            <p>以下の内容で登録します。内容をご確認ください。</p>
        </div>


        <div class="confirm-card">

            <h2 class="section-title">登録内容</h2>

            <div class="confirm-item">
                <div class="confirm-label">名前</div>
                <div class="confirm-value" th:text="${form.name}"></div>
            </div>

            <div class="confirm-item">
                <div class="confirm-label">生年月日</div>
                <div class="confirm-value" th:text="${form.birthDate}"></div>
            </div>

            <div class="confirm-item">
                <div class="confirm-label">メールアドレス</div>
                <div class="confirm-value" th:text="${form.mail}"></div>
            </div>

            <div class="confirm-item">
                <div class="confirm-label">パスワード</div>
                <div class="confirm-value">********</div>
            </div>


            <!-- ボタン -->
            <div class="button-area">

                <!-- 登録する -->
                <form th:action="@{/register/complete}" method="post">
                    <button type="submit" class="button register-button">
                        登録する
                    </button>
                </form>

                <!-- 入力画面へ戻る -->
                <form th:action="@{/members/register}" method="get">
                    <button type="submit" class="button back-button">
                        戻る
                    </button>
                </form>

            </div>

        </div>

    </main>

</body>
</html>
