<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員登録完了 - 不時着タウン</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, #252525 0%, #111 45%, #070707 100%);
            color: #f5f5f5;
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            min-height: 100vh;
        }

        /* ヘッダー */
        .header {
            height: 76px;
            padding: 0 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid #d4af37;
        }

        .logo {
            color: #d4af37;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .login-link {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            color: #d4af37;
        }

        /* メイン */
        .container {
            width: 92%;
            max-width: 700px;
            margin: 80px auto;
        }

        .complete-card {
            background: linear-gradient(145deg, #1d1d1d, #111);
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 10px;
            padding: 55px 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        /* チェックマーク */
        .check {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 34px;
        }

        .sub-title {
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 32px;
            font-weight: 600;
        }

        .message {
            color: #ccc;
            line-height: 2;
            font-size: 15px;
            margin-bottom: 35px;
        }

        /* ボタン */
        .login-button {
            display: inline-block;
            min-width: 200px;
            padding: 14px 30px;
            background: linear-gradient(135deg, #d4af37, #b8941f);
            color: #111;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* スマホ */
        @media (max-width: 600px) {

            .header {
                padding: 0 20px;
            }

            .container {
                margin: 50px auto;
            }

            .complete-card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="logo">不時着タウン</div>

        <a th:href="@{/login}" class="login-link">
            ログイン
        </a>
    </header>


    <!-- メイン -->
    <main class="container">

        <div class="complete-card">

            <div class="check">✓</div>

            <div class="sub-title">
                REGISTRATION COMPLETE
            </div>

            <h1>会員登録完了</h1>

            <div class="message">
                <p>会員登録が正常に完了しました。</p>
                <p>不時着タウンへのご登録ありがとうございます。</p>
            </div>

            <a th:href="@{/shops}" class="login-button">
                ログイン画面へ
            </a>

        </div>

    </main>

</body>
</html>
