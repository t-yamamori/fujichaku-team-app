<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>会員登録</title>
</head>
<body>
	<h1>会員登録</h1>
	<form th:action="@{/register/confirm}"
	         th:object="${form}"
	         method="post">

	       <div>
	           <label>名前</label>
	           <input type="text" th:field="*{name}">
	           <p th:if="${#fields.hasErrors('name')}"
	              th:errors="*{name}"></p>
	       </div>

	       <div>
	           <label>生年月日</label>
	           <input type="date" th:field="*{birthDate}">
	           <p th:if="${#fields.hasErrors('birthDate')}"
	              th:errors="*{birthDate}"></p>
	       </div>

	       <div>
	           <label>メールアドレス</label>
	           <input type="email" th:field="*{mail}">
	           <p th:if="${#fields.hasErrors('mail')}"
	              th:errors="*{mail}"></p>
	       </div>

	       <div>
	           <label>パスワード</label>
	           <input type="password" th:field="*{password}">
	           <p th:if="${#fields.hasErrors('password')}"
	              th:errors="*{password}"></p>
	       </div>

	       <button type="submit">確認</button>

	   </form>

	   
	   
</body>
</html>
