<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店舗一覧</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <!-- 上部：タイトル（左） / アカウントメニュー（右上） -->
    <div class="header">
        <h1 class="page-title">店舗一覧</h1>

        <!-- 未ログイン：会員登録／ログイン -->
        <div class="account-menu" th:unless="${isMember}">
            <!-- 会員登録：RegisterController（GET /register → register/register.html） -->
            <a class="btn btn-accent" th:href="@{/register}">会員登録</a>
            <!-- ログイン：register/complete.html と同じ /login に合わせている（担当者の実装に合わせて変更可） -->
            <a class="btn btn-primary" th:href="@{/login}">ログイン</a>
        </div>

        <!-- ログイン済み：会員情報／ログアウト -->
        <div class="account-menu" th:if="${isMember}">
            <span class="welcome">ログイン中</span>
            <!-- 会員情報：MembersController の showEdit（GET /members/edit）→ showEdit.html
                 ※showEdit.html の変更フォームが POST /members/edit なので、表示も同じURLの GET と想定。
                   MembersController の @GetMapping が違う場合はここを合わせてください -->
            <a class="btn btn-secondary" th:href="@{/members/showEdit}">会員情報</a>
            <!-- ログアウト：POST /shops/logout → 処理後はトップ画面(/shops)へリダイレクト
                 （Spring Security を使う場合も th:action ならCSRFトークンが自動で入る） -->
            <form th:action="@{/shops/logout}" method="post">
                <button type="submit" class="btn btn-secondary">ログアウト</button>
            </form>
        </div>
    </div>

    <!-- 結果メッセージ（ログアウト後のリダイレクトで受け取るフラッシュ属性など） -->
    <div class="flash flash-success" th:if="${message}" th:text="${message}">ログアウトしました。</div>
    <div class="flash flash-error" th:if="${errorMessage}" th:text="${errorMessage}">エラーメッセージ</div>

    <!-- 検索入力 -->
    <div class="top-bar">
        <form class="search-form" th:action="@{/shops/search}" method="get">
            <input type="text" name="name" placeholder="店舗名で検索" required>
            <button type="submit" class="btn btn-primary">検索</button>
        </form>
    </div>

    <!-- パスワード再設定（未ログインのときだけ表示） -->
    <!-- ※パスワード再設定画面のURLは決まり次第変更してください -->
    <div class="sub-link" th:unless="${isMember}">
        <a th:href="@{/password/reset}">パスワードをお忘れの方はこちら（パスワード再設定）</a>
    </div>

    <!-- 店舗一覧・表示 -->
    <ul class="shop-list" th:if="${!#lists.isEmpty(stores)}">
        <li class="shop-card" th:each="s : ${stores}">
            <a th:href="@{/shops/{shopId}(shopId=${s.id})}">
                <img th:if="${s.pictureUrl != null}" th:src="${s.pictureUrl}" th:alt="${s.name}">
                <div th:unless="${s.pictureUrl != null}" class="no-image">No Image</div>
                <div class="body">
                    <p class="name" th:text="${s.name}">店舗名</p>
                    <p class="address" th:text="${s.address}">住所</p>
                </div>
            </a>
        </li> 
    </ul>
    <div class="empty" th:if="${#lists.isEmpty(stores)}">登録されている店舗はありません。</div>

</div>
</body>
</html>
