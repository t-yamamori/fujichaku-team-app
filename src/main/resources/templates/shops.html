<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>店舗一覧</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title">店舗一覧</h1>

    <!-- 上段：検索入力（左） / 会員登録（右） -->
    <div class="top-bar">
        <form class="search-form" th:action="@{/shops/search}" method="get">
            <input type="text" name="name" placeholder="店舗名で検索" required>
            <button type="submit" class="btn btn-primary">検索</button>
        </form>
        <!-- ※会員登録画面のURLは決まり次第変更してください -->
        <a class="btn btn-accent" th:href="@{/members/register}">会員登録</a>
    </div>

    <!-- パスワード再設定（一覧の右上） -->
    <!-- ※パスワード再設定画面のURLは決まり次第変更してください -->
    <div class="sub-link">
        <a th:href="@{/password/reset}">パスワードをお忘れの方はこちら（パスワード再設定）</a>
    </div>

    <!-- 店舗一覧・表示 -->
    <ul class="shop-list" th:if="${!#lists.isEmpty(stores)}">
        <li class="shop-card" th:each="s : ${stores}">
            <a th:href="@{/shops/{shopId}(shopId=${s.id})}">
                <img th:if="${s.pictureUrl != null}" th:src="${s.pictureUrl}" th:alt="${s.name}">
                <div th:unless="${s.pictureUrl != null}" class="no-image">No Image</div>
                <div class="body">
                    <p class="name" th:text="${s.name}">店舗名</p>
                    <p class="address" th:text="${s.address}">住所</p>
                </div>
            </a>
        </li>
    </ul>
    <div class="empty" th:if="${#lists.isEmpty(stores)}">登録されている店舗はありません。</div>

	
</div>
</body>
</html>
