<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>管理者ログイン</title>
	<link rel="stylesheet" th:href="@{/css/adminLayoutTop.css}">
</head>

<body>
    <canvas id="matrixRain" aria-hidden="true"></canvas>
    <div class="screen-overlay" aria-hidden="true"></div>

    <form th:action="@{/adminLogin}" method="post">

        <div>
            <label>
                管理者ID
            </label>

            <input type="text"
                   name="username">
        </div>

        <div>
            <label>
                パスワード
            </label>

            <input type="password"
                   name="password">
        </div>

        <div th:if="${param.error}">
            <p style="color:red;">
                管理者IDまたはパスワードが正しくありません。
            </p>
        </div>

        <button type="submit">
            ログイン
        </button>

    </form>
	    <script th:src="@{/js/matrixRain.js}"></script>
	</body>

</html>
