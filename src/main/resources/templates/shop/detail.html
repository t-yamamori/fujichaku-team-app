<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>店舗詳細</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: sans-serif;
        }

        .container {
            width: 370px;
            margin: 0 auto;
        }

        .shop-image {
            height: 130px;
            background-color: #1f6684;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .menu-button {
            width: 100%;
            height: 45px;
            margin-bottom: 10px;
            background-color: #1f6684;
            border: 2px solid #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .menu-button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 店舗一覧・表示 -->
    <div class="shop-image">
        店舗一覧・表示
    </div>

    <!-- 口コミ追加 -->
    <form th:action="@{/shops/review/add}" method="get">
        <button type="submit" class="menu-button">
            口コミ追加
        </button>
    </form>

    <!-- 口コミ削除 -->
    <form th:action="@{/shops/review/delete}" method="get">
        <button type="submit" class="menu-button">
            口コミ削除
        </button>
    </form>

</div>

</body>
</html>
