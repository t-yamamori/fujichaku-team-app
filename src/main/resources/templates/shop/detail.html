<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${store.name} + ' | 店舗詳細'">店舗詳細</title>
    <link rel="stylesheet" th:href="@{/css/shops.css}">
</head>
<body>
<div class="container">

    <h1 class="page-title" th:text="${store.name}">店舗名</h1>

    <!-- ① 店舗情報 -->
    <section class="section">
        <div class="shop-detail">
            <div>
                <img th:if="${store.pictureUrl != null}" th:src="${store.pictureUrl}" th:alt="${store.name}">
                <div th:unless="${store.pictureUrl != null}" class="no-image">No Image</div>
            </div>
            <dl>
                <dt>店舗名</dt> <dd th:text="${store.name}">店舗名</dd>
                <dt>代表者</dt> <dd th:text="${store.representative}">代表者</dd>
                <dt>住所</dt>   <dd th:text="${store.address}">住所</dd>
                <dt>連絡先</dt> <dd th:text="${store.mail}">mail</dd>
                <dt>説明</dt>   <dd th:text="${store.description}">説明</dd>
            </dl>
        </div>
    </section>

    <!-- ② 予約ボタン -->
    <!-- ※予約画面のURLは決まり次第変更してください -->
    <div class="reserve-area">
        <a class="btn btn-accent btn-block"
           th:href="@{/reservations/new(storeId=${store.id})}">この店舗を予約する</a>
    </div>

    <!-- ③ 口コミ -->
    <section class="section">
        <h2>口コミ</h2>

        <div th:if="${#lists.isEmpty(reviews)}" class="note">まだ口コミはありません。</div>

        <div class="review" th:each="r : ${reviews}">
            <div class="meta">
                <span class="stars"
                      th:text="${#strings.repeat('★', r.grade) + #strings.repeat('☆', 5 - r.grade)}">★★★☆☆</span>
                <span th:text="${r.createdAt != null} ? ${#temporals.format(r.createdAt, 'yyyy/MM/dd HH:mm')} : ''">2026/10/01</span>
            </div>
            <p class="comment" th:text="${r.comment}">コメント</p>
        </div>

        <p class="note" th:unless="${isMember}">
            ※会員の方はすべての口コミを見ることができます。
        </p>
    </section>

    <!-- ④ 予約がある場合、予約日時を表示（会員限定） -->
    <section class="section" th:if="${isMember}">
        <h2>あなたの予約</h2>

        <table class="reservation-table" th:if="${!#lists.isEmpty(reservations)}">
            <thead>
                <tr>
                    <th>予約日時</th>
                    <th>予約状況</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rs : ${reservations}">
                    <td th:text="${#temporals.format(rs.reservation_date, 'yyyy/MM/dd(E) HH:mm')}">2026/10/10 18:00</td>
                    <td th:text="${rs.status}">予約済み</td>
                </tr>
            </tbody>
        </table>

        <p class="note" th:if="${#lists.isEmpty(reservations)}">この店舗の予約はありません。</p>
    </section>

    <a class="back-link" th:href="@{/shops}">← 店舗一覧へ戻る</a>

	
	
</div>
</body>
</html>
